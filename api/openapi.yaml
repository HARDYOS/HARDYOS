openapi: 3.1.0
info:
  title: HardyOS API
  version: 0.1.0
  description: |
    The hardyd control-plane API. The web desktop, hardyctl and apps all use it.
    This file is the source of truth: regenerate the TypeScript client with
    `make gen` after changing it.

    Authentication: a session cookie set by `POST /auth/login` or
    `POST /setup/admin`: `__Host-hardyos_session` over HTTPS, `hardyos_session`
    over plain HTTP (development). For one release the old name is still read
    over HTTPS on the desktop's own address, never on a published one. State-changing requests (POST, PATCH, PUT, DELETE)
    must send the header `X-HardyOS-Request: 1`; requests without it are
    rejected with 403 `csrf`.
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - name: system
  - name: auth
  - name: users
  - name: jobs
  - name: audit
  - name: hardware
  - name: storage
  - name: notifications
  - name: installer
  - name: updates
  - name: network
  - name: backups
  - name: terminal
  - name: domain
  - name: shares
  - name: apps
  - name: sharelinks
  - name: files
  - name: remote
  - name: oidc
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      tags: [system]
      security: []
      responses:
        "200":
          description: hardyd is running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /version:
    get:
      operationId: getVersion
      summary: Build information
      tags: [system]
      security: []
      responses:
        "200":
          description: Version and build details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
  /setup:
    get:
      operationId: getSetupStatus
      summary: Whether first-time setup is still needed
      tags: [auth]
      security: []
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
  /setup/admin:
    post:
      operationId: createFirstAdmin
      summary: Create the first administrator (only while no accounts exist)
      description: The new account is flagged break-glass and is signed in.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupAdminRequest" }
      responses:
        "201":
          description: Administrator created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Invalid" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/login:
    post:
      operationId: login
      summary: Sign in
      description: |
        Local HardyOS accounts sign in with their username. When this server
        has a domain, domain accounts sign in as `alice`, `HOME\alice` or
        `alice@home.example.net` (a local account wins for a bare name); the
        password is checked by Kerberos with the domain controller this
        server runs itself, never with its partners. The role is admin for
        members of Domain Admins (`<domain SID>-512`) or of the HardyOS
        Admins group recorded by its SID; group names don't count.
        401 codes: `bad_credentials` (wrong password or unknown name),
        `unknown_domain`, `account_disabled`, `account_locked`,
        `account_expired`, `account_unavailable`, `password_expired`.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in; session cookie set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: This server's own domain controller isn't answering (`domain_unavailable`), its clock is too far off (`clock_skew`), or this server runs no domain controller of its own (`no_local_dc`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many failed sign-ins; see Retry-After
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out this browser
      tags: [auth]
      security: []
      responses:
        "204": { description: Signed out }
  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/password:
    post:
      operationId: changePassword
      summary: Change your own password (signs out your other sessions)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /users:
    get:
      operationId: listUsers
      summary: List accounts (admin)
      tags: [users]
      responses:
        "200":
          description: All accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createUser
      summary: Create an account (admin)
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Invalid" }
        "409": { $ref: "#/components/responses/Conflict" }
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getUser
      summary: Get an account (admin)
      tags: [users]
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateUser
      summary: Update an account (admin)
      description: Disabling an account signs out its sessions. The last active admin can't be demoted or disabled.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteUser
      summary: Delete an account (admin)
      tags: [users]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /users/{id}/password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: resetUserPassword
      summary: Set another user's password (admin; signs them out)
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Password set }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { $ref: "#/components/responses/NotFound" }
  /jobs:
    get:
      operationId: listJobs
      summary: Recent jobs (admins see all, users their own)
      tags: [jobs]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Jobs, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
  /jobs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getJob
      summary: One job
      tags: [jobs]
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }
  /jobs/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: cancelJob
      summary: Ask a queued or running job to stop
      tags: [jobs]
      responses:
        "202": { description: Cancellation requested }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /events:
    get:
      operationId: streamEvents
      summary: WebSocket stream of events you may see
      description: |
        Upgrade to a WebSocket. The server sends JSON messages: first
        `{"type":"hello","user":"..."}`, then `Event` objects (job updates,
        notifications, and for admins audit entries).
      tags: [system]
      responses:
        "101": { description: Switching to WebSocket }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /audit:
    get:
      operationId: listAudit
      summary: Audit log, newest first (admin)
      tags: [audit]
      parameters:
        - { name: action, in: query, description: Action prefix, e.g. "user.", schema: { type: string } }
        - { name: actorId, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: before, in: query, description: Return entries with id lower than this (paging), schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/info:
    get:
      operationId: getSystemInfo
      summary: Hostname, OS, kernel and uptime
      tags: [system]
      responses:
        "200":
          description: System info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
  /system/metrics:
    get:
      operationId: getMetrics
      summary: Current CPU, memory and network use with ~5 minutes of history
      tags: [system]
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metrics" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /system/self-test:
    post:
      operationId: runSelfTest
      summary: Start a job that checks the job system and root helper (admin)
      tags: [system]
      responses:
        "202":
          description: Job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /hardware:
    get:
      operationId: getHardware
      summary: Detected hardware, disks and the capability profile (admin)
      tags: [hardware]
      responses:
        "200":
          description: Hardware
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hardware" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /hardware/disks/{name}/smart:
    parameters:
      - { name: name, in: path, required: true, description: Kernel disk name, e.g. sda, schema: { type: string } }
    get:
      operationId: getDiskSmart
      summary: Live SMART report for one disk (admin)
      tags: [hardware]
      responses:
        "200":
          description: SMART report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SMART" }
        "404": { $ref: "#/components/responses/NotFound" }
  /hardware/disk-health:
    get:
      operationId: listDiskHealth
      summary: Last scheduled SMART verdict per disk (admin)
      tags: [hardware]
      responses:
        "200":
          description: Disk health
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiskHealth" }
  /storage/pools:
    get:
      operationId: listPools
      summary: Imported pools (admin)
      tags: [storage]
      responses:
        "200":
          description: Pools
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pool" }
    post:
      operationId: createPool
      summary: Create a pool (admin; runs as a job, erases the disks)
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec, confirmWipe]
              additionalProperties: false
              properties:
                spec: { $ref: "#/components/schemas/PoolSpec" }
                confirmWipe: { type: boolean, const: true }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
  /storage/recommendation:
    get:
      operationId: getPoolRecommendation
      summary: Suggested layout for a new pool from unused disks (admin)
      tags: [storage]
      parameters:
        - { name: name, in: query, schema: { type: string, default: tank } }
      responses:
        "200":
          description: Recommendation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recommendation" }
        "422":
          description: No usable disks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /storage/importable:
    get:
      operationId: listImportablePools
      summary: Pools found on disks that aren't imported (admin)
      tags: [storage]
      responses:
        "200":
          description: Importable pools
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImportablePool" }
  /storage/import:
    post:
      operationId: importPool
      summary: Import a pool by name or numeric ID (admin)
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pool]
              additionalProperties: false
              properties:
                pool: { type: string }
                force: { type: boolean, description: Import a pool last used by another system }
      responses:
        "200":
          description: Pools after import
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pool" }
        "422": { $ref: "#/components/responses/Failed" }
  /storage/pools/{pool}:
    parameters:
      - { name: pool, in: path, required: true, schema: { type: string } }
    get:
      operationId: getPoolStatus
      summary: Pool status with the device tree (admin)
      tags: [storage]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PoolStatus" }
        "422": { $ref: "#/components/responses/Failed" }
    delete:
      operationId: destroyPool
      summary: Destroy a pool and everything on it (admin)
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmName]
              additionalProperties: false
              properties:
                confirmName: { type: string, description: Must repeat the pool name exactly }
      responses:
        "204": { description: Destroyed }
        "400": { $ref: "#/components/responses/Invalid" }
        "409": { $ref: "#/components/responses/Conflict" }
  /storage/pools/{pool}/vdevs:
    parameters:
      - { name: pool, in: path, required: true, schema: { type: string } }
    post:
      operationId: addVdevs
      summary: Add data, special, log, cache or spare devices (admin; job)
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec, confirmWipe]
              additionalProperties: false
              properties:
                spec: { $ref: "#/components/schemas/PoolSpec" }
                confirmWipe: { type: boolean, const: true }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
  /storage/pools/{pool}/attach:
    parameters:
      - { name: pool, in: path, required: true, schema: { type: string } }
    post:
      operationId: attachDisk
      summary: Widen a RAIDZ vdev (expansion) or a mirror with a new disk (admin; job)
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, disk, confirmWipe]
              additionalProperties: false
              properties:
                target: { type: string, examples: ["raidz2-0"] }
                disk: { type: string, description: /dev/disk/by-id path }
                confirmWipe: { type: boolean, const: true }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
  /storage/pools/{pool}/replace:
    parameters:
      - { name: pool, in: path, required: true, schema: { type: string } }
    post:
      operationId: replaceDisk
      summary: Replace a failed or old disk and resilver (admin; job)
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old, disk, confirmWipe]
              additionalProperties: false
              properties:
                old: { type: string, description: Device path or GUID being replaced }
                disk: { type: string, description: New disk's /dev/disk/by-id path }
                confirmWipe: { type: boolean, const: true }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
  /storage/pools/{pool}/device:
    parameters:
      - { name: pool, in: path, required: true, schema: { type: string } }
    post:
      operationId: poolDeviceAction
      summary: Bring a device online or offline, or remove a cache/log/spare device (admin)
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, device]
              additionalProperties: false
              properties:
                action: { type: string, enum: [online, offline, remove] }
                device: { type: string }
      responses:
        "200":
          description: Status after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PoolStatus" }
        "400": { $ref: "#/components/responses/Invalid" }
  /storage/pools/{pool}/scrub:
    parameters:
      - { name: pool, in: path, required: true, schema: { type: string } }
    post:
      operationId: scrubPool
      summary: Start, pause or stop a scrub (admin)
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                action: { type: string, enum: [start, pause, stop], default: start }
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PoolStatus" }
        "409": { $ref: "#/components/responses/Conflict" }
  /storage/pools/{pool}/clear:
    parameters:
      - { name: pool, in: path, required: true, schema: { type: string } }
    post:
      operationId: clearPoolErrors
      summary: Clear device error counters (admin)
      tags: [storage]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PoolStatus" }
  /storage/pools/{pool}/export:
    parameters:
      - { name: pool, in: path, required: true, schema: { type: string } }
    post:
      operationId: exportPool
      summary: Export a pool so its disks can be moved (admin)
      tags: [storage]
      responses:
        "204": { description: Exported }
  /storage/datasets:
    get:
      operationId: listDatasets
      summary: Filesystems and volumes (admin)
      tags: [storage]
      parameters:
        - { name: root, in: query, description: Only this dataset and its children, schema: { type: string } }
      responses:
        "200":
          description: Datasets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Dataset" }
    post:
      operationId: createDataset
      summary: Create a filesystem, or a volume when volSize is set (admin)
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, examples: ["tank/family"] }
                volSize: { type: string, examples: ["128G"] }
                props: { $ref: "#/components/schemas/DatasetProps" }
      responses:
        "201":
          description: Created dataset
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Dataset" }
        "400": { $ref: "#/components/responses/Invalid" }
    patch:
      operationId: updateDataset
      summary: Change dataset properties (admin)
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, props]
              additionalProperties: false
              properties:
                name: { type: string }
                props: { $ref: "#/components/schemas/DatasetProps" }
      responses:
        "200":
          description: Updated dataset
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Dataset" }
        "400": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: destroyDataset
      summary: Destroy a dataset (admin)
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, confirmName]
              additionalProperties: false
              properties:
                name: { type: string }
                recursive: { type: boolean }
                confirmName: { type: string, description: Must repeat the dataset name exactly }
      responses:
        "204": { description: Destroyed }
        "400": { $ref: "#/components/responses/Invalid" }
  /storage/snapshots:
    get:
      operationId: listSnapshots
      summary: Snapshots, oldest first (admin)
      tags: [storage]
      parameters:
        - { name: root, in: query, schema: { type: string } }
      responses:
        "200":
          description: Snapshots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Snapshot" }
    post:
      operationId: createSnapshot
      summary: Take a snapshot (admin)
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset, label]
              additionalProperties: false
              properties:
                dataset: { type: string }
                label: { type: string }
                recursive: { type: boolean }
      responses:
        "201": { description: Created }
        "400": { $ref: "#/components/responses/Invalid" }
    delete:
      operationId: destroySnapshot
      summary: Delete a snapshot (admin)
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, examples: ["tank/family@before-update"] }
      responses:
        "204": { description: Deleted }
  /storage/snapshots/rollback:
    post:
      operationId: rollbackSnapshot
      summary: Roll a dataset back to a snapshot (admin)
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, confirm]
              additionalProperties: false
              properties:
                name: { type: string }
                destroyNewer: { type: boolean, description: Also destroy snapshots newer than this one }
                confirm: { type: boolean, const: true }
      responses:
        "204": { description: Rolled back }
        "400": { $ref: "#/components/responses/Invalid" }
  /storage/snapshot-policies:
    get:
      operationId: listSnapshotPolicies
      summary: Automatic snapshot schedules (admin)
      tags: [storage]
      responses:
        "200":
          description: Policies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SnapshotPolicy" }
    post:
      operationId: saveSnapshotPolicy
      summary: Create (id 0) or update a snapshot schedule (admin)
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnapshotPolicy" }
      responses:
        "200":
          description: Saved policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotPolicy" }
        "400": { $ref: "#/components/responses/Invalid" }
  /storage/snapshot-policies/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      operationId: deleteSnapshotPolicy
      summary: Remove a snapshot schedule; existing snapshots stay (admin)
      tags: [storage]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /storage/scrub-policies:
    get:
      operationId: listScrubPolicies
      summary: Scrub schedules (admin)
      tags: [storage]
      responses:
        "200":
          description: Policies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScrubPolicy" }
    post:
      operationId: saveScrubPolicy
      summary: Create or update a pool's scrub schedule (admin)
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScrubPolicy" }
      responses:
        "200":
          description: Saved policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScrubPolicy" }
        "400": { $ref: "#/components/responses/Invalid" }
  /notifications:
    get:
      operationId: listNotifications
      summary: Your notification center, newest first
      tags: [notifications]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /notifications/{id}/read:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: markNotificationRead
      summary: Mark one notification read
      tags: [notifications]
      responses:
        "204": { description: Marked read }
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark all your notifications read
      tags: [notifications]
      responses:
        "204": { description: Marked read }
  /system/updates:
    get:
      operationId: getUpdateStatus
      summary: Installed versions, a pending update and the last update result
      tags: [updates]
      responses:
        "200":
          description: Update state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/updates/upload:
    post:
      operationId: uploadUpdate
      summary: Upload a signed update file (.hupd) and install it as a new version
      description: The request body is the raw file. The new version starts on the next restart.
      tags: [updates]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: The file is too large
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /system/updates/download:
    post:
      operationId: downloadUpdate
      summary: Download a signed update file from an https address and install it
      tags: [updates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/updates/check:
    get:
      operationId: getUpdateCheck
      summary: Automatic update check setting and the newest version found
      tags: [updates]
      responses:
        "200":
          description: Check state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateCheck" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: checkForUpdates
      summary: Look for a new version on GitHub now
      description: A failed check (no internet) still answers 200; lastError says why.
      tags: [updates]
      responses:
        "200":
          description: Check state after checking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateCheck" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setUpdateCheck
      summary: Turn the daily update check on or off
      tags: [updates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [autoCheck]
              properties:
                autoCheck: { type: boolean }
      responses:
        "200":
          description: Check state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateCheck" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/updates/install-available:
    post:
      operationId: installAvailableUpdate
      summary: Download and install the newer version the last check found
      description: The update file's signature is checked like any other update.
      tags: [updates]
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /system/versions/{name}/activate:
    post:
      operationId: activateVersion
      summary: Start an installed version on the next restart (roll back)
      tags: [updates]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                restoreSettings:
                  type: boolean
                  description: Also restore settings saved before the running version was installed
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/versions/{name}/delete:
    post:
      operationId: deleteVersion
      summary: Remove an installed version that is not running or the default
      tags: [updates]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmName]
              properties:
                confirmName: { type: string }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/reboot:
    post:
      operationId: rebootSystem
      summary: Restart the server (saves settings first when an update is waiting)
      tags: [system]
      responses:
        "202": { description: Restarting }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Failed" }
  /network:
    get:
      operationId: getNetwork
      summary: Network settings, live interfaces and any change waiting for confirmation
      tags: [network]
      responses:
        "200":
          description: Network state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: applyNetwork
      summary: Apply new network settings
      description: |
        Runs as a job. The new settings are undone automatically unless
        POST /network/confirm arrives before the deadline in /network's
        pending field, so a mistake can't lock anyone out. A 400 lists every
        problem in details.
      tags: [network]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkConfig" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /network/confirm:
    post:
      operationId: confirmNetwork
      summary: Keep the network change that's waiting
      tags: [network]
      responses:
        "200":
          description: The settings now saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkConfig" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /network/revert:
    post:
      operationId: revertNetwork
      summary: Undo the network change that's waiting
      tags: [network]
      responses:
        "204": { description: The previous settings are back }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/time:
    get:
      operationId: getTime
      summary: Time zone, automatic time and clock sync state
      tags: [network]
      responses:
        "200":
          description: Clock state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: setTime
      summary: Set the time zone and automatic time (NTP)
      tags: [network]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimeConfig" }
      responses:
        "200":
          description: Clock state after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeStatus" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/time/clock:
    post:
      operationId: setClock
      summary: Set the date and time by hand (automatic time must be off)
      tags: [network]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [time]
              properties:
                time: { type: string, format: date-time }
      responses:
        "200":
          description: Clock state after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeStatus" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/backups:
    get:
      operationId: getBackups
      summary: Nightly backup settings, backups kept on pools, and restore state
      tags: [backups]
      responses:
        "200":
          description: Backup state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/backups/settings:
    put:
      operationId: setBackupSettings
      summary: Change the nightly backup settings
      tags: [backups]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupSettings" }
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSettings" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/backups/run:
    post:
      operationId: runBackup
      summary: Back up settings onto a pool now
      tags: [backups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pool: { type: string, description: Empty for the configured or first data pool }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/backups/download:
    post:
      operationId: prepareBackupDownload
      summary: Make a password-protected backup to download
      description: Not a job, so the password is never kept. Fetch the file from /system/backups/files/{name} within an hour.
      tags: [backups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, secrets]
              properties:
                password: { type: string, minLength: 8 }
                secrets: { type: boolean, description: Also include storage encryption keys and SSH host keys }
      responses:
        "200":
          description: The prepared file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupDownload" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/backups/files/{name}:
    get:
      operationId: getBackupFile
      summary: Download a prepared backup file
      tags: [backups]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: as, in: query, required: false, schema: { type: string }, description: File name to save as }
      responses:
        "200":
          description: The backup file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /system/backups/upload:
    post:
      operationId: uploadBackup
      summary: Upload a backup file to restore
      tags: [backups]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The upload's name, for /system/backups/restore
          content:
            application/json:
              schema:
                type: object
                required: [upload]
                properties:
                  upload: { type: string }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/backups/restore:
    post:
      operationId: restoreBackup
      summary: Check a backup and restore it at the next restart
      description: Not a job, so the password is never kept.
      tags: [backups]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreSource" }
      responses:
        "200":
          description: The restore waiting for a restart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupStaged" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /system/backups/restore/cancel:
    post:
      operationId: cancelRestore
      summary: Cancel a restore waiting for a restart
      tags: [backups]
      responses:
        "204": { description: Cancelled }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /storage/boot:
    get:
      operationId: getBootDisks
      summary: The boot (system) pool, its disks, and disks that could join it
      tags: [storage]
      responses:
        "200":
          description: Boot disks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootDisks" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /storage/boot/replace:
    post:
      operationId: replaceBootDisk
      summary: Replace a boot disk with a new one
      description: The new disk gets the same partitions as a working boot disk, joins the mirror and gets the boot loader.
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old, disk, confirmWipe]
              properties:
                old: { type: string, description: The device as the pool status names it }
                disk: { type: string, description: The new disk's by-id path }
                confirmWipe: { type: boolean }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /storage/boot/attach:
    post:
      operationId: attachBootDisk
      summary: Add a disk to the boot mirror
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disk, confirmWipe]
              properties:
                disk: { type: string }
                confirmWipe: { type: boolean }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /storage/boot/detach:
    post:
      operationId: detachBootDisk
      summary: Remove a disk from the boot mirror (refused for the last working one)
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device]
              properties:
                device: { type: string }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /terminal/settings:
    get:
      operationId: getTerminalSettings
      summary: Whether the browser terminal is on
      tags: [terminal]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setTerminalSettings
      summary: Turn the browser terminal on or off
      tags: [terminal]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminalSettings" }
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /terminal/session:
    post:
      operationId: openTerminalSession
      summary: Re-enter the password to get a one-time ticket for /terminal/ws
      description: The ticket works once, within 30 seconds, for the same administrator.
      tags: [terminal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: The ticket
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429":
          description: Too many wrong passwords
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /terminal/ws:
    get:
      operationId: terminalWebSocket
      summary: WebSocket to a root shell
      description: |
        Upgrade with ?ticket=&cols=&rows=. Binary frames carry terminal bytes
        both ways; text frames carry control messages: {"type":"resize","cols":N,"rows":N}
        from the browser, {"type":"closed","reason":"..."} to it. The session
        closes after 15 minutes without input and after 8 hours.
      tags: [terminal]
      parameters:
        - { name: ticket, in: query, required: true, schema: { type: string } }
        - { name: cols, in: query, required: true, schema: { type: integer } }
        - { name: rows, in: query, required: true, schema: { type: integer } }
      responses:
        "101": { description: Switching to the WebSocket protocol }
        "403": { $ref: "#/components/responses/Forbidden" }
  # ---- Shared folders (docs/shares.md) ------------------------------------
  /shares:
    get:
      operationId: listShares
      summary: Every shared folder on every pool
      description: |
        Everyone signed in may list them. Access rules, apps and storage
        details (pool, dataset) are shown to administrators only.
      tags: [shares]
      responses:
        "200":
          description: Shared folders, by name
          content:
            application/json:
              schema:
                type: object
                required: [shares]
                properties:
                  shares: { type: array, items: { $ref: "#/components/schemas/Share" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: createShare
      summary: Create a shared folder (runs as a job)
      tags: [shares]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareCreateRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /shares/starter:
    post:
      operationId: createStarterShares
      summary: "Create the starter shared folders on a pool (runs as a job): Media with Movies, TV, Music and Photos, and Backups"
      description: Folders that already exist are skipped.
      tags: [shares]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareStarterRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /shares/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getShare
      summary: One shared folder
      tags: [shares]
      responses:
        "200":
          description: The shared folder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Share" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateShare
      summary: Change a shared folder's name, description, quota, flags or access rules (runs as a job)
      description: Fields left out keep their values.
      tags: [shares]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareUpdateRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteShare
      summary: Delete a shared folder and every file in it (runs as a job)
      description: Refused while an app uses it (409, naming the apps).
      tags: [shares]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, description: "The shared folder's name, typed to confirm" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /shares/{id}/folders:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listShareFolders
      summary: Subfolders of a folder inside a shared folder (for pickers)
      description: Hidden folders and links aren't listed; paths can't leave the shared folder.
      tags: [shares]
      parameters:
        - { name: path, in: query, schema: { type: string, default: "" }, description: "A folder inside the share, like Movies/Kids; empty for the share itself" }
      responses:
        "200":
          description: Folder names
          content:
            application/json:
              schema:
                type: object
                required: [folders]
                properties:
                  folders: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ---- end of shared folders ---------------------------------------------
  # ---- Share links (part D; docs/file-sharing.md, decisions 96-98) --------
  # The public pages a link opens (/s/<token>, /s/<token>/download,
  # /s/<token>/upload, /s/<token>/unlock) are HTML served by hardyd outside
  # /api/v1 and the desktop session; they aren't part of this API.
  /sharelinks:
    get:
      operationId: listShareLinks
      summary: Links I've shared, or everyone's (administrators, scope=all)
      tags: [sharelinks]
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [mine, all], default: mine } }
      responses:
        "200":
          description: Links, newest first
          content:
            application/json:
              schema:
                type: object
                required: [links]
                properties:
                  links: { type: array, items: { $ref: "#/components/schemas/ShareLink" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createShareLink
      summary: Make a link to a file or folder
      description: |
        Allowed for administrators and for anyone who may change the file or
        folder. The token is in the answer once; only its hash is stored.
      tags: [sharelinks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareLinkRequest" }
      responses:
        "201":
          description: The new link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareLinkCreated" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /sharelinks/{id}/revoke:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: revokeShareLink
      summary: Turn a link off for good (its creator or an administrator)
      tags: [sharelinks]
      responses:
        "200":
          description: The link, now revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ---- end of share links ------------------------------------------------
  # ---- files API (consumed by File Manager; owned by part C) -------------
  # docs/plans/file-sharing.md section 3.
  # Files are read and written as the signed-in person (domain accounts as
  # themselves, HardyOS administrators as hardyos-files). HardyOS accounts
  # that aren't administrators get 403 no_access. Paths are inside the
  # share, "/" separated, no leading slash; "" is its top. The share id
  # "~home" is the person's home folder. Errors: 404 not_found, 403
  # no_access, 409 exists / not_allowed (links, "..", reserved names such
  # as .recycle, .zfs, .hardyos*), 507 full.
  /files/shares:
    get:
      operationId: listFileShares
      summary: The shared folders (and Home) the person can open
      tags: [files]
      responses:
        "200":
          description: Home first, then by name
          content:
            application/json:
              schema:
                type: object
                required: [shares]
                properties:
                  shares: { type: array, items: { $ref: "#/components/schemas/FileShare" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /files/list:
    get:
      operationId: listFiles
      summary: A folder's files and folders (links, devices and hidden names aren't listed)
      tags: [files]
      parameters:
        - { name: share, in: query, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string } }
        - { name: snapshot, in: query, description: "List the folder as it was in this automatic snapshot (from /files/versions)", schema: { type: string } }
      responses:
        "200":
          description: The folder and its entries, folders first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileListing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /files/stat:
    get:
      operationId: statFile
      summary: One file or folder
      tags: [files]
      parameters:
        - { name: share, in: query, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string } }
        - { name: snapshot, in: query, schema: { type: string } }
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /files/download:
    get:
      operationId: downloadFiles
      summary: Download a file (with Range support), or folders and several items as a zip
      description: |
        One file is sent as is: Range / If-Range requests give 206 partial
        content (video seeking, resumed downloads). With `inline=1` images,
        video, audio, PDFs and text are shown in the browser (text, HTML and
        SVG as plain text); everything else is always an attachment.
        A folder, or several `path`s from the same share, is streamed as a
        zip (stored, not compressed; a folder's contents are at the top of
        the zip, several items each under its own name). Files that can't
        be read are listed in "Files not included.txt" inside the zip.
      tags: [files]
      parameters:
        - { name: share, in: query, required: true, schema: { type: string } }
        - { name: path, in: query, description: Repeat for several items, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: snapshot, in: query, description: Download an older version, schema: { type: string } }
        - { name: inline, in: query, description: "1: show in the browser when the type is safe to", schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: The file, or a zip
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
            application/zip: { schema: { type: string, format: binary } }
        "206": { description: Part of the file (Range) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /files/upload:
    post:
      operationId: startFileUpload
      summary: Start a resumable upload of one file
      description: |
        Makes an empty hidden temporary file next to `path`; send the bytes
        with `PUT /files/upload/{id}`. The file only shows under its name
        once complete, so a half-uploaded file never does. Uploads nobody
        continues for a day are removed (as are all of them when hardyd
        restarts: start again).
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileUploadRequest" }
      responses:
        "201":
          description: The upload, to send chunks to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileUpload" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /files/upload/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: sendFileChunk
      summary: Send the next chunk (raw bytes) at offset; the chunk that completes the file puts it in place
      description: |
        `offset` must be the upload's `received`; otherwise 409 with
        `received` (carry on from there). Bytes past `size` are refused
        (400). The completing chunk (for an empty file: one empty PUT)
        renames the file into place and answers with its `entry`.
      tags: [files]
      parameters:
        - { name: offset, in: query, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: How much has arrived (and the file once complete)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileUpload" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Out of step (wrong_offset), another chunk is being written (busy), or the name was taken meanwhile (exists)
          content:
            application/json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
                  received: { type: integer, format: int64 }
                  upload: { $ref: "#/components/schemas/FileUpload" }
        "507": { description: The shared folder is full }
    get:
      operationId: getFileUpload
      summary: How far an upload has got
      tags: [files]
      responses:
        "200":
          description: The upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileUpload" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: cancelFileUpload
      summary: Cancel an upload and throw away what arrived
      tags: [files]
      responses:
        "204": { description: Cancelled }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /files/mkdir:
    post:
      operationId: makeFolder
      summary: Make a folder
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FilePathRequest" }
      responses:
        "201":
          description: The new folder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /files/rename:
    post:
      operationId: renameFile
      summary: Rename one file or folder in place
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [share, path, name]
              properties:
                share: { type: string }
                path: { type: string }
                name: { type: string, description: The new name (no slashes); it must be free }
      responses:
        "200":
          description: The renamed entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileEntry" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /files/move:
    post:
      operationId: moveFiles
      summary: Move items into a folder (within or across shares)
      description: |
        Within a share moves are renames, answered at once (200). Into
        another share they're a copy and a delete: up to 5 files (none
        over 256 MB) at once, anything more as a job (202) whose result is
        the same `FileBulkResult`. A single item that fails answers with
        its error.
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileTransferRequest" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileBulkResult" }
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /files/copy:
    post:
      operationId: copyFiles
      summary: Copy items into a folder (within or across shares)
      description: |
        Up to 5 files (none over 256 MB) are copied at once (200);
        folders and anything more run as a job (202) with progress, its
        result the same `FileBulkResult`. Copies keep modification times.
        A single item that fails answers with its error.
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileTransferRequest" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileBulkResult" }
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /files/delete:
    post:
      operationId: deleteFiles
      summary: Delete items (to the folder's recycle bin when it has one)
      description: "Up to 5 items at once (200), more as a job (202) whose result is the same `FileBulkResult`. `recycled`: everything deleted went to the recycle bin. Audited."
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [share, paths]
              properties:
                share: { type: string }
                paths: { type: array, items: { type: string }, maxItems: 1000 }
                permanent: { type: boolean, description: Skip the recycle bin }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileBulkResult" }
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /files/snapshots:
    get:
      operationId: listFileVersions
      summary: Older versions of a file or folder, from the automatic snapshots, newest first
      description: A file's versions that are the same as the current file or the next newer version are left out.
      tags: [files]
      parameters:
        - { name: share, in: query, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The versions
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions: { type: array, items: { $ref: "#/components/schemas/FileVersion" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /files/restore:
    post:
      operationId: restoreFileVersion
      summary: Copy an older version back next to the current one
      description: |
        Copied back to its path if nothing is there now, otherwise to
        "name (restored 2026-10-24).ext". Answers when done (200), or with
        `background: true` runs as a job (202 JobAccepted, its result
        this same object) with progress, for big folders. Audited.
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [share, path, snapshot]
              properties:
                share: { type: string }
                path: { type: string }
                snapshot: { type: string }
                background: { type: boolean }
      responses:
        "200":
          description: Where it was written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilePathResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  # ---- end of files API (part C) -----------------------------------------
  # ---- Shared folder snapshots and NFS (file sharing part B) --------------
  /shares/{id}/snapshots:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listShareSnapshots
      summary: A shared folder's snapshots, newest first
      description: >-
        For administrators and anyone the folder's access rules let use it
        (404 for others). Automatic snapshots are named
        hardyos-auto-<kind>_<YYYY-MM-DD-HHMM> (UTC, the slot they stand for).
      tags: [shares]
      responses:
        "200":
          description: Snapshots
          content:
            application/json:
              schema:
                type: object
                required: [snapshots]
                properties:
                  snapshots: { type: array, items: { $ref: "#/components/schemas/ShareSnapshot" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createShareSnapshot
      summary: Take a snapshot now (runs as a job)
      description: Manual snapshots are never deleted by the automatic pruning.
      tags: [shares]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "Letters, digits and . _ : - (up to 64); empty for manual-<YYYY-MM-DD-HHMM>. Names starting with hardyos-auto- are refused."
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /shares/{id}/snapshots/{snapshot}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: snapshot, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteShareSnapshot
      summary: Delete one snapshot (runs as a job)
      tags: [shares]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, description: "The snapshot's name, to confirm" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /shares/{id}/nfs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getShareNFS
      summary: How a shared folder is reached over NFS (for the mount command)
      description: NFS is turned on and its clients chosen in the folder's services (PATCH /shares/{id}).
      tags: [shares]
      responses:
        "200":
          description: NFS details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareNFS" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ---- end of shared folder snapshots and NFS -----------------------------
  # ---- File Services: SMB file server (file sharing part A) ---------------
  /files:
    get:
      operationId: getFileServices
      summary: The SMB file server's status, settings and how to connect
      description: Everyone signed in may read it (to see how to connect); settings, problems and per-folder notes are for administrators.
      tags: [files]
      responses:
        "200":
          description: The file server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileServicesStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /files/join:
    post:
      operationId: joinFileServices
      summary: Make this server a member of the domain so its accounts can use the shared folders (runs as a job)
      description: The password goes to the job through a one-time in-memory reference and to Samba on stdin; it's never stored. Leave domain out to join this server's own DC's domain.
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileServicesJoinRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /files/leave:
    post:
      operationId: leaveFileServices
      summary: Take this server out of the domain (runs as a job)
      description: Needs confirm true. With the Administrator password the computer account is deleted from the domain too; without it this server only forgets the domain.
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileServicesLeaveRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /files/settings:
    patch:
      operationId: updateFileServicesSettings
      summary: Turn SMB sharing on or off and set up home folders (runs as a job)
      description: Fields left out keep their values.
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileServicesSettingsRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  # ---- end of File Services ------------------------------------------------
  /domain:
    get:
      operationId: getDomain
      summary: The Active Directory domain and its domain controller
      tags: [domain]
      responses:
        "200":
          description: Domain status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createDomain
      summary: Create the domain (runs as a job, about half a minute)
      description: |
        Provisions a Samba AD domain controller with its own address on the
        NAS's network. The Administrator password is handed to the job in
        memory, never stored with it.
      tags: [domain]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DomainProvisionRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteDomain
      summary: Delete the domain and every account, group and computer in it (runs as a job)
      tags: [domain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, description: The domain name, typed to confirm }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /domain/suggest:
    get:
      operationId: suggestDomainSettings
      summary: Defaults for the setup wizard, including a free address for the domain controller
      tags: [domain]
      responses:
        "200":
          description: Suggested settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainSuggestion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /domain/enabled:
    put:
      operationId: setDomainEnabled
      summary: Start or stop the domain controller
      tags: [domain]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Enabled" }
      responses:
        "200":
          description: Domain status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainStatus" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /domain/join:
    post:
      operationId: joinDomain
      summary: Make this server another domain controller of an existing domain (runs as a job)
      description: |
        Copies the domain from an existing domain controller (accounts, groups,
        DNS) and keeps both in sync. The Administrator password reaches the job
        in memory only.
      tags: [domain]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DomainJoinRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /domain/leave:
    post:
      operationId: leaveDomain
      summary: Remove this domain controller from the domain; the others keep it (runs as a job)
      tags: [domain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adminPassword]
              properties:
                adminPassword: { type: string, format: password }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /domain/controllers/remove:
    post:
      operationId: removeDeadDomainController
      summary: Take a domain controller that's gone for good out of the domain, from this one (runs as a job)
      description: Roles it held move here. Refused while it still answers.
      tags: [domain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, confirm]
              properties:
                name: { type: string, example: dc1.home.hardynetworks.net }
                confirm: { type: string, description: The same name, typed to confirm }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /domain/forwarders:
    put:
      operationId: setDomainForwarders
      summary: DNS servers the domain uses for names outside it (two at most); restarts the domain controller
      tags: [domain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [forwarders]
              properties:
                forwarders: { type: array, items: { type: string } }
      responses:
        "200":
          description: Domain status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainStatus" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /domain/users:
    get:
      operationId: listDomainUsers
      summary: The domain's accounts
      tags: [domain]
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/DomainUser" } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createDomainUser
      summary: Add an account
      tags: [domain]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DomainNewUser" }
      responses:
        "201":
          description: The new account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainUser" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /domain/users/{username}:
    parameters:
      - { name: username, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateDomainUser
      summary: Change an account's name or email
      tags: [domain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                givenName: { type: string }
                surname: { type: string }
                email: { type: string }
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainUser" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deleteDomainUser
      summary: Delete an account
      tags: [domain]
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /domain/users/{username}/password:
    parameters:
      - { name: username, in: path, required: true, schema: { type: string } }
    post:
      operationId: resetDomainUserPassword
      summary: Set a new password (also unlocks the account)
      tags: [domain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
                mustChangePassword: { type: boolean }
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainUser" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /domain/users/{username}/enabled:
    parameters:
      - { name: username, in: path, required: true, schema: { type: string } }
    put:
      operationId: setDomainUserEnabled
      summary: Turn an account on or off
      tags: [domain]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Enabled" }
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainUser" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /domain/groups:
    get:
      operationId: listDomainGroups
      summary: The domain's groups
      tags: [domain]
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups: { type: array, items: { $ref: "#/components/schemas/DomainGroup" } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createDomainGroup
      summary: Add a group
      tags: [domain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                members: { type: array, items: { type: string } }
      responses:
        "201":
          description: The new group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainGroup" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /domain/groups/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateDomainGroup
      summary: Change a group's description or members
      tags: [domain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
                add: { type: array, items: { type: string } }
                remove: { type: array, items: { type: string } }
      responses:
        "200":
          description: The group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainGroup" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deleteDomainGroup
      summary: Delete a group (its members stay)
      tags: [domain]
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /domain/admins-group:
    post:
      operationId: setUpDomainAdminsGroup
      summary: Create the HardyOS Admins group and record its SID (runs as a job)
      description: |
        Members of the recorded group are HardyOS administrators, by SID, so
        renaming it doesn't matter and another group given its name grants
        nothing. When a group called HardyOS Admins already exists that
        HardyOS didn't record, the answer is 409 `admins_group_exists`
        (the message lists its members) unless `adopt` is true, after an
        administrator checked them. 409 `admins_group_recorded` when it's
        already set up. The job's result is a DomainAdminsGroup.
      tags: [domain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                adopt: { type: boolean, description: Use the existing group called HardyOS Admins }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /apps:
    get:
      operationId: listApps
      summary: Installed Docker apps and how they're doing
      description: |
        Everyone signed in sees the installed apps so they can open them.
        Containers, datasets, kept data and updates are shown to
        administrators only.
      tags: [apps]
      responses:
        "200":
          description: The App Store's main view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppsOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /apps/catalog:
    get:
      operationId: listAppCatalog
      summary: Apps that ship with HardyOS, ready to install
      tags: [apps]
      responses:
        "200":
          description: Catalog packages
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AppPackage" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /apps/packages:
    post:
      operationId: uploadAppPackage
      summary: Upload a .hardyapp package (at most 512 KB) to install it
      description: |
        The package is checked and kept by its SHA-256, which is the `ref`
        to plan and install it with (`source: upload`).
      tags: [apps]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The package
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppPackage" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: The package is too big
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /apps/plan:
    post:
      operationId: planAppInstall
      summary: "What the install dialog needs: free ports, pools, and whether this replaces an installed copy"
      tags: [apps]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppPackageRef" }
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppPlan" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /apps/install:
    post:
      operationId: installApp
      summary: Install an app (runs as a job; downloads its images and starts it)
      description: |
        Password settings are handed to the job in memory, never stored with
        it. Installing an app that's already installed reinstalls it with the
        given settings, keeping its data and generated passwords. When the
        installed (or kept) app with that id came from another source or
        another imported catalog (`AppPlan.replaceSourceRequired`), the
        answer is 409 `replace_source_required` unless `replaceSource` is
        true; a confirmed replacement is audited (`apps.replace_source`).
      tags: [apps]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppInstallRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /apps/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: removeApp
      summary: Remove an app (runs as a job), keeping or deleting its data
      tags: [apps]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppRemoveRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /apps/{id}/update:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: updateApp
      summary: Update an app (runs as a job; a snapshot is taken first)
      description: |
        Without a body: to the newest version in the catalog the app came from
        (HardyOS's or an imported one). Uploaded and custom apps name the new
        package. The app keeps its data, ports, settings and shares. The job
        snapshots the app first; if a later step fails it ends with
        `result.snapshot` so the App Store can offer to roll back. An update
        of a non-catalog app that asks for new permissions answers 400
        `grants_required` (with `grants`) before anything changes: send it
        again with every grant in `grants`. An imported app updates from the
        catalog it was installed from (by its id). A package from another
        source or catalog answers 409 `replace_source_required` unless
        `replaceSource` is true.
      tags: [apps]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppUpdateRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400":
          description: Invalid, or new permissions need allowing (code grants_required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppGrantsNeeded" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /apps/{id}/{action}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: action, in: path, required: true, schema: { type: string, enum: [start, stop, restart] } }
    post:
      operationId: appAction
      summary: Start, stop or restart an app
      tags: [apps]
      responses:
        "200":
          description: The app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Failed" }
  /apps/{id}/logs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getAppLogs
      summary: The app's recent output, every container together
      tags: [apps]
      parameters:
        - { name: lines, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 300 } }
      responses:
        "200":
          description: Logs
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  logs: { type: string }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  # ---- App Store v2: apps API and web (docs/plans/app-store-v2.md section 3) ----
  /apps/catalogs:
    get:
      operationId: listImportedAppCatalogs
      summary: Imported (third-party) app catalogs
      tags: [apps]
      responses:
        "200":
          description: Catalogs, by name
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AppCatalog" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: importAppCatalog
      summary: Import a catalog from an https index.json, or refresh one already imported
      description: |
        hardyd fetches the index (at most 1 MB, 30 second timeout). Apps with
        problems are left out and described in `lastError`. Packages are
        downloaded when first planned and used only if their SHA-256 matches.
        Every connection is checked after DNS and after each redirect:
        addresses on this server or its own networks (loopback, link-local,
        RFC 1918, CGNAT, unique-local) are refused unless `localNetwork` is
        true for the catalog ("On my network", audited as
        `apps.catalog.local_network`); unspecified, multicast and broadcast
        addresses always are.
      tags: [apps]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppCatalogRequest" }
      responses:
        "200":
          description: The catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppCatalog" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: removeAppCatalog
      summary: Forget an imported catalog (apps installed from it keep running)
      tags: [apps]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppCatalogRemoveRequest" }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /apps/custom:
    post:
      operationId: createCustomApp
      summary: Build a custom app (source custom) from a pasted Compose file and plan its install
      description: |
        The Compose file publishes each port as `${HARDY_PORT_<NAME>}` and
        keeps its data under `${HARDY_APP_DATA}`. Custom apps are sandboxed
        like uploads; hardyd-priv checks the file when it prepares the app.
        Install it with `source: custom` and the plan's `package.ref`.
      tags: [apps]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomAppRequest" }
      responses:
        "200":
          description: The install plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppPlan" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /apps/{id}/config:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getAppConfig
      summary: An installed app's settings, ports, shared folders, grants and limits
      description: Password settings are never returned (`value` is empty, `set` says whether one exists).
      tags: [apps]
      responses:
        "200":
          description: The configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Failed" }
    patch:
      operationId: reconfigureApp
      summary: Change an installed app (runs as a job, then restarts it)
      description: |
        Omitted fields keep their values; a password left empty keeps its
        value. A share choice with `share: ""` removes that shared folder.
        `grants` replaces the app's extra permissions (non-catalog apps; each
        change is audited).
      tags: [apps]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppConfigUpdate" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /apps/{id}/access:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getAppAccess
      summary: Who may use an app (empty = everyone signed in)
      tags: [apps]
      responses:
        "200":
          description: The access list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppAccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setAppAccess
      summary: Choose who may use an app (administrators always may)
      tags: [apps]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppAccess" }
      responses:
        "200":
          description: The stored access list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppAccess" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /apps/{id}/snapshots:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listAppSnapshots
      summary: Snapshots of an app's dataset, newest first (to roll back to)
      tags: [apps]
      responses:
        "200":
          description: Snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSnapshots" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Failed" }
  /apps/{id}/rollback:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: rollbackApp
      summary: Put an app back to one of its snapshots (runs as a job; later changes are lost)
      tags: [apps]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppRollbackRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /apps/{id}/open:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: openApp
      summary: Where to open an app's web page, for a desktop window or a new tab
      description: |
        Anyone who may use the app. With the window proxy running, the URL is
        the app's HTTPS proxy port with a single-use token valid for a minute;
        ask again for every window or tab.
      tags: [apps]
      responses:
        "200":
          description: The address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppOpen" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  # ---- end of App Store v2 apps API ----
  # ---- Remote access: NetBird client and publishing (docs/remote-access.md, part A) ----
  /remote:
    get:
      operationId: getRemote
      summary: Remote Access status
      description: |
        The NetBird client on this server, the publishing settings (the
        access token only as `hasToken`), every publishable thing (the
        desktop and each app with a web page) with the last sync's state,
        and the app gateway.
      tags: [remote]
      responses:
        "200":
          description: The status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /remote/join:
    post:
      operationId: joinNetBird
      summary: Join a NetBird network with a setup key (job remote.join)
      description: |
        The setup key reaches the job only through hardyd's memory and goes
        to `netbird up` in its environment; it is never in job parameters,
        results, logs or answers.
      tags: [remote]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoteJoinRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /remote/leave:
    post:
      operationId: leaveNetBird
      summary: Leave the NetBird network (job remote.leave)
      description: Removes this server's services from NetBird first (when it can), then signs out and turns the client off.
      tags: [remote]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoteLeaveRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /remote/publishing:
    put:
      operationId: setRemotePublishing
      summary: Save the publishing settings and update NetBird (job remote.settings)
      tags: [remote]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemotePublishingRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /remote/check:
    get:
      operationId: checkRemote
      summary: The publishing setup check
      description: Checks the token, this server's peer, the base domain in NetBird, the wildcard CNAME and the proxy cluster's capabilities; says what to add where.
      tags: [remote]
      responses:
        "200":
          description: The check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteCheck" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /remote/domain:
    post:
      operationId: remoteDomain
      summary: Add the base domain to NetBird, or ask NetBird to verify it (job remote.domain)
      tags: [remote]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoteDomainRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /remote/sync:
    post:
      operationId: syncRemote
      summary: Update NetBird's services now (job remote.sync; it also runs every 10 minutes)
      tags: [remote]
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /remote/gateway/rotate:
    post:
      operationId: rotateRemoteGatewaySecret
      summary: Replace the gateway secret and put the new per-service values in NetBird (job remote.gateway.rotate)
      tags: [remote]
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /remote/desktop:
    put:
      operationId: publishDesktop
      summary: How the desktop is published (job remote.service)
      tags: [remote]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /apps/{id}/publish:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getAppPublish
      summary: How an app is published through NetBird
      tags: [remote, apps]
      responses:
        "200":
          description: The app's publishing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppPublish" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      operationId: publishApp
      summary: Publish an app NetBird-only or publicly, or not at all (job remote.service)
      tags: [remote, apps]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  # ---- end of remote access ----
  /installer:
    get:
      operationId: getInstallerStatus
      summary: Whether this server is the live installer, and the install's progress
      description: |
        On an installed system this returns `active: false`. On the live ISO
        the whole API is replaced by the /installer endpoints, which are
        unlocked with the one-time code shown on the server's console.
      tags: [installer]
      security: []
      responses:
        "200":
          description: Installer state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallerStatus" }
  /installer/unlock:
    post:
      operationId: unlockInstaller
      summary: Enter the code shown on the server's console
      tags: [installer]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, examples: ["K7QM-4TXP"] }
      responses:
        "200":
          description: Unlocked; sets the `hardyos_installer` cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallerStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: Too many wrong codes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /installer/hardware:
    get:
      operationId: getInstallerHardware
      summary: Disks and network interfaces to choose from
      tags: [installer]
      security: [{ installer: [] }]
      responses:
        "200":
          description: Hardware
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallerHardware" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /installer/check:
    post:
      operationId: checkInstallPlan
      summary: Validate an install plan against the hardware without changing anything
      tags: [installer]
      security: [{ installer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { $ref: "#/components/schemas/InstallPlan" }
      responses:
        "200":
          description: The plan is valid; per-disk warnings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallCheck" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /installer/install:
    post:
      operationId: startInstall
      summary: Erase the boot disks and install HardyOS
      tags: [installer]
      security: [{ installer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallRequest" }
      responses:
        "202":
          description: Install started; follow it on GET /installer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /installer/reboot:
    post:
      operationId: rebootInstaller
      summary: Restart the server (into the new system once installed)
      tags: [installer]
      security: [{ installer: [] }]
      responses:
        "202": { description: Restarting }
        "401": { $ref: "#/components/responses/Unauthorized" }
  # ---- sign-in provider (OIDC), Control Panel > Sign-in (OIDC) (remote access part B) ----
  /oidc:
    get:
      operationId: getOidc
      summary: The sign-in provider's issuer, settings and signing keys (admin)
      tags: [oidc]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OidcStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: updateOidc
      summary: Choose the issuer or who may sign in to apps (admin; job oidc.settings, answered when it finishes)
      tags: [oidc]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                issuer: { type: string, description: "The issuer URL; empty goes back to the one HardyOS works out. On sso.<base> it has no path" }
                localAccounts: { type: boolean, description: "HardyOS (non-domain) accounts may sign in to apps (off by default)" }
                publicAdmins: { type: boolean, description: "Administrators may sign in through HardyOS sign-in from the internet (off by default)" }
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OidcStatus" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /oidc/keys/rotate:
    post:
      operationId: rotateOidcKeys
      summary: Sign with the next key now; the current one stays published for 2 days (admin)
      tags: [oidc]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OidcStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /oidc/presets:
    get:
      operationId: listOidcPresets
      summary: Ready-made clients (NetBird) with what to paste where (admin)
      tags: [oidc]
      parameters:
        - { name: netbirdUrl, in: query, schema: { type: string }, description: "NetBird's dashboard address (default https://vpn.hardynetworks.net)" }
      responses:
        "200":
          description: Presets
          content:
            application/json:
              schema:
                type: object
                required: [presets]
                properties:
                  presets: { type: array, items: { $ref: "#/components/schemas/OidcPreset" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /oidc/clients:
    get:
      operationId: listOidcClients
      summary: Apps that sign people in through HardyOS (admin)
      tags: [oidc]
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: object
                required: [clients]
                properties:
                  clients: { type: array, items: { $ref: "#/components/schemas/OidcClient" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createOidcClient
      summary: Add a client; a confidential client's secret is in the answer, once (admin)
      tags: [oidc]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OidcClientSpec" }
      responses:
        "201":
          description: The client and its secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OidcClientResult" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /oidc/clients/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getOidcClient
      summary: One client (admin)
      tags: [oidc]
      responses:
        "200":
          description: The client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OidcClient" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateOidcClient
      summary: Change a client (all fields); a client made confidential gets a secret, returned once (admin)
      tags: [oidc]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OidcClientSpec" }
      responses:
        "200":
          description: The client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OidcClientResult" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteOidcClient
      summary: Remove a client, its sign-ins, tokens and consents (admin)
      tags: [oidc]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /oidc/clients/{id}/secret:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: newOidcClientSecret
      summary: Replace a confidential client's secret; the new one is in the answer, once (admin)
      tags: [oidc]
      responses:
        "200":
          description: The new secret
          content:
            application/json:
              schema:
                type: object
                required: [secret]
                properties:
                  secret: { type: string }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /oidc/clients/{id}/revoke:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: revokeOidcClient
      summary: End every sign-in at a client (its tokens stop working) (admin)
      tags: [oidc]
      responses:
        "200":
          description: How many sign-ins were ended
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ---- end of sign-in provider paths ----
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-hardyos_session
      description: "hardyos_session over plain HTTP (development)"
    installer:
      type: apiKey
      in: cookie
      name: hardyos_installer
  responses:
    JobAccepted:
      description: Queued as a background job; follow it on /jobs/{id} or the event stream
      content:
        application/json:
          schema:
            type: object
            required: [job, warnings]
            properties:
              job: { $ref: "#/components/schemas/Job" }
              warnings: { type: array, items: { type: string } }
    Unavailable:
      description: The root helper isn't running
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Failed:
      description: The operation ran and failed (message from zpool/zfs)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not signed in or session expired
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicts with current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      required: [status, uptimeSeconds]
      properties:
        status: { type: string, enum: [ok] }
        uptimeSeconds: { type: number, description: Seconds since hardyd started }
    VersionInfo:
      type: object
      required: [version, commit, goVersion, os, arch]
      properties:
        version: { type: string, examples: ["0.1.0"] }
        commit: { type: string }
        goVersion: { type: string }
        os: { type: string }
        arch: { type: string }
    SetupStatus:
      type: object
      required: [needsAdmin]
      properties:
        needsAdmin: { type: boolean, description: True until the first administrator exists }
        domainSignIn: { type: boolean, description: This server has a domain whose accounts can sign in to the desktop }
    SetupAdminRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string }
        password: { type: string, minLength: 10 }
        displayName: { type: string }
        email: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string }
        password: { type: string }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 10 }
    Role:
      type: string
      enum: [admin, user]
    User:
      type: object
      required: [id, username, displayName, email, role, disabled, breakGlass, createdAt, lastLoginAt, source, principal, groups]
      properties:
        source:
          type: string
          enum: [local, domain]
          description: A local HardyOS account, or a domain account that has signed in to the desktop
        principal:
          type: string
          description: How access rules name this user — `alice` for local accounts, `HOME\alice` for domain accounts
        groups:
          type: array
          items: { type: string }
          description: A domain account's groups as `HOME\Family` (Domain Users included), looked up at sign-in and at most every 10 minutes; empty for local accounts
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        breakGlass:
          type: boolean
          description: A local recovery account that keeps working even after directory sign-in is enabled
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: [string, "null"], format: date-time }
        roleNote:
          type: string
          description: >-
            Why a domain account's role isn't what its groups give: its groups
            couldn't be looked up for over 30 minutes, so it has user rights
            until the domain answers again. Absent otherwise.
    CreateUserRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string }
        password: { type: string, minLength: 10 }
        displayName: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
    ResetPasswordRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string, minLength: 10 }
    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    Job:
      type: object
      required: [id, kind, title, state, progress, message, error, params, result, createdBy, createdAt, startedAt, finishedAt]
      properties:
        id: { type: string }
        kind: { type: string, examples: ["system.selftest"] }
        title: { type: string }
        state: { $ref: "#/components/schemas/JobState" }
        progress: { type: number, minimum: 0, maximum: 100 }
        message: { type: string }
        error: { type: string }
        params: { type: object, additionalProperties: true }
        result: { type: object, additionalProperties: true }
        createdBy: { type: [integer, "null"], format: int64 }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
    AuditEntry:
      type: object
      required: [id, at, actorId, actor, action, target, outcome, detail, ip]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actorId: { type: [integer, "null"], format: int64 }
        actor: { type: string }
        action: { type: string, examples: ["auth.login", "user.create"] }
        target: { type: string }
        outcome: { type: string, enum: [success, failure, denied] }
        detail: { type: string }
        ip: { type: string }
    Event:
      type: object
      required: [id, type, time]
      properties:
        id: { type: integer }
        type: { type: string, examples: ["job.updated", "notification", "audit.created"] }
        time: { type: string, format: date-time }
        data: { description: Payload; a Job for job.updated, an AuditEntry for audit.created }
    Disk:
      type: object
      required: [name, path, byId, model, serial, wwn, transport, kind, sizeBytes, physSector, removable, usage, pool, usageDetail, partitions, powerLossProt]
      properties:
        name: { type: string, examples: ["sda"] }
        path: { type: string }
        byId: { type: string, description: Stable /dev/disk/by-id path used for pools }
        model: { type: string }
        serial: { type: string }
        wwn: { type: string }
        transport: { type: string }
        kind: { type: string, enum: [hdd, ssd, nvme] }
        sizeBytes: { type: integer }
        physSector: { type: integer }
        removable: { type: boolean }
        usage: { type: string, enum: [free, has-data, pool, boot, mounted] }
        pool: { type: string }
        usageDetail: { type: string }
        partitions:
          type: array
          items:
            type: object
            required: [name, sizeBytes, fsType, label, mountpoints]
            properties:
              name: { type: string }
              sizeBytes: { type: integer }
              fsType: { type: string }
              label: { type: string }
              mountpoints: { type: [array, "null"], items: { type: string } }
        powerLossProt: { type: [boolean, "null"] }
    Hardware:
      type: object
      required: [system, disks, capabilities]
      properties:
        system:
          type: object
          required: [cpu, memory, gpus, nics, iommuEnabled, iommuGroups, virtual]
          properties:
            cpu:
              type: object
              required: [model, vendor, threads, virtualization]
              properties:
                model: { type: string }
                vendor: { type: string }
                threads: { type: integer }
                virtualization: { type: string, enum: ["vt-x", "amd-v", ""] }
            memory:
              type: object
              required: [totalBytes, ecc]
              properties:
                totalBytes: { type: integer }
                ecc: { type: [boolean, "null"] }
            gpus:
              type: array
              items:
                type: object
                required: [address, class, vendorId, deviceId, vendor, driver, iommuGroup]
                properties:
                  address: { type: string }
                  class: { type: string }
                  vendorId: { type: string }
                  deviceId: { type: string }
                  vendor: { type: string, enum: [intel, amd, nvidia, other] }
                  driver: { type: string }
                  iommuGroup: { type: [integer, "null"] }
            nics:
              type: array
              items:
                type: object
                required: [name, mac, speedMbps, up, driver]
                properties:
                  name: { type: string }
                  mac: { type: string }
                  speedMbps: { type: integer }
                  up: { type: boolean }
                  driver: { type: string }
            iommuEnabled: { type: boolean }
            iommuGroups: { type: integer }
            virtual: { type: boolean }
        disks:
          type: array
          items: { $ref: "#/components/schemas/Disk" }
        capabilities:
          type: object
          required: [virtualization, pciePassthrough, hardwareTranscode, specialVdev, slog, l2arc, eccMemory, arcMaxBytes, advisories]
          properties:
            virtualization: { type: boolean }
            pciePassthrough: { type: boolean }
            hardwareTranscode: { type: boolean }
            specialVdev: { type: boolean }
            slog: { type: boolean }
            l2arc: { type: boolean }
            eccMemory: { type: [boolean, "null"] }
            arcMaxBytes: { type: integer }
            advisories: { type: array, items: { type: string } }
    SMART:
      type: object
      required: [device, model, serial, capacityBytes, rotationRpm, health, reasons]
      properties:
        device: { type: string }
        model: { type: string }
        serial: { type: string }
        capacityBytes: { type: integer }
        rotationRpm: { type: integer }
        passed: { type: [boolean, "null"] }
        temperatureC: { type: [integer, "null"] }
        powerOnHours: { type: [integer, "null"] }
        reallocated: { type: [integer, "null"] }
        pending: { type: [integer, "null"] }
        uncorrectable: { type: [integer, "null"] }
        crcErrors: { type: [integer, "null"] }
        percentUsed: { type: [integer, "null"] }
        mediaErrors: { type: [integer, "null"] }
        criticalWarning: { type: [integer, "null"] }
        health: { type: string, enum: [good, warning, failing, unknown] }
        reasons: { type: array, items: { type: string } }
    DiskHealth:
      type: object
      required: [byId, health, reasons, temperatureC, checkedAt]
      properties:
        byId: { type: string }
        health: { type: string, enum: [good, warning, failing, unknown] }
        reasons: { type: array, items: { type: string } }
        temperatureC: { type: [integer, "null"] }
        checkedAt: { type: string, format: date-time }
    Pool:
      type: object
      required: [name, sizeBytes, allocBytes, freeBytes, fragmentation, capacityPct, health, guid]
      properties:
        name: { type: string }
        sizeBytes: { type: integer }
        allocBytes: { type: integer }
        freeBytes: { type: integer }
        fragmentation: { type: [integer, "null"] }
        capacityPct: { type: integer }
        health: { type: string, examples: ["ONLINE", "DEGRADED"] }
        guid: { type: string }
    Vdev:
      type: object
      required: [name, type, class, state, read, write, checksum, disk, note, children]
      properties:
        name: { type: string }
        type: { type: string, enum: [root, mirror, raidz1, raidz2, raidz3, draid, replacing, spare, disk, file] }
        class: { type: string, enum: [data, special, dedup, log, cache, spare] }
        state: { type: string }
        read: { type: integer }
        write: { type: integer }
        checksum: { type: integer }
        disk: { type: string, description: Whole-disk by-id path for leaf devices }
        note: { type: string }
        children:
          type: array
          items: { $ref: "#/components/schemas/Vdev" }
    Scan:
      type: object
      required: [kind, state, percent, errors, finishedAt, remaining, text]
      properties:
        kind: { type: string, enum: [scrub, resilver, expand, none] }
        state: { type: string, enum: [running, paused, finished, cancelled, none] }
        percent: { type: [number, "null"] }
        errors: { type: [integer, "null"] }
        finishedAt: { type: [string, "null"], format: date-time }
        remaining: { type: string }
        text: { type: string }
    PoolStatus:
      type: object
      required: [name, state, status, action, scan, expand, errors, root, groups]
      properties:
        name: { type: string }
        state: { type: string }
        status: { type: string }
        action: { type: string }
        scan: { $ref: "#/components/schemas/Scan" }
        expand:
          oneOf:
            - { $ref: "#/components/schemas/Scan" }
            - { type: "null" }
        errors: { type: string }
        root: { $ref: "#/components/schemas/Vdev" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/Vdev" }
    VdevSpec:
      type: object
      required: [type, disks]
      properties:
        type: { type: string, enum: [stripe, mirror, raidz1, raidz2, raidz3] }
        disks: { type: array, items: { type: string } }
    PoolSpec:
      type: object
      required: [name, data, encrypt]
      properties:
        name: { type: string }
        data: { type: array, items: { $ref: "#/components/schemas/VdevSpec" } }
        special: { $ref: "#/components/schemas/VdevSpec" }
        log: { $ref: "#/components/schemas/VdevSpec" }
        cache: { type: array, items: { type: string } }
        spares: { type: array, items: { type: string } }
        encrypt: { type: boolean }
        specialSmallBlocks: { type: string, examples: ["32K"] }
    Recommendation:
      type: object
      required: [spec, usableBytes, survives, explanation, warnings, unused]
      properties:
        spec: { $ref: "#/components/schemas/PoolSpec" }
        usableBytes: { type: integer }
        survives: { type: integer }
        explanation: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        unused: { type: array, items: { type: string } }
    ImportablePool:
      type: object
      required: [name, id, state, status]
      properties:
        name: { type: string }
        id: { type: string }
        state: { type: string }
        status: { type: string }
    Dataset:
      type: object
      required: [name, type, usedBytes, availBytes, referBytes, mountpoint, compression, compressRatio, encryption, keyStatus, quotaBytes, recordSize, volSizeBytes, mounted]
      properties:
        name: { type: string }
        type: { type: string, enum: [filesystem, volume] }
        usedBytes: { type: integer }
        availBytes: { type: integer }
        referBytes: { type: integer }
        mountpoint: { type: string }
        compression: { type: string }
        compressRatio: { type: string }
        encryption: { type: string }
        keyStatus: { type: string }
        quotaBytes: { type: integer }
        recordSize: { type: string }
        volSizeBytes: { type: integer }
        mounted: { type: boolean }
    DatasetProps:
      type: object
      description: |
        Allowed: compression, atime, readonly, relatime, sync, recordsize, special_small_blocks,
        quota, refquota, reservation, refreservation, copies, xattr, mountpoint (under /mnt),
        and hardyos:* user properties.
      additionalProperties: { type: string }
    Snapshot:
      type: object
      required: [name, dataset, label, usedBytes, referBytes, createdAt]
      properties:
        name: { type: string }
        dataset: { type: string }
        label: { type: string }
        usedBytes: { type: integer }
        referBytes: { type: integer }
        createdAt: { type: string, format: date-time }
    SnapshotPolicy:
      type: object
      required: [dataset, frequency, keep]
      properties:
        id: { type: integer, format: int64, description: 0 or absent to create }
        dataset: { type: string }
        frequency: { type: string, enum: [hourly, daily, weekly, monthly] }
        keep: { type: integer, minimum: 1, maximum: 1000 }
        recursive: { type: boolean }
        enabled: { type: boolean }
        lastRunAt: { type: [string, "null"], format: date-time, readOnly: true }
        lastError: { type: string, readOnly: true }
    ScrubPolicy:
      type: object
      required: [pool, intervalDays]
      properties:
        pool: { type: string }
        intervalDays: { type: integer, minimum: 1, maximum: 365 }
        enabled: { type: boolean }
        lastStartedAt: { type: [string, "null"], format: date-time, readOnly: true }
        lastError: { type: string, readOnly: true }
    Notification:
      type: object
      required: [id, at, level, title, body, source, adminOnly, readAt]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        level: { type: string, enum: [info, success, warning, error] }
        title: { type: string }
        body: { type: string }
        source: { type: string }
        adminOnly: { type: boolean }
        readAt: { type: [string, "null"], format: date-time }
    SystemInfo:
      type: object
      required: [hostname, os, kernel, version, uptimeSecs]
      properties:
        hostname: { type: string }
        os: { type: string }
        kernel: { type: string }
        version: { type: string }
        uptimeSecs: { type: number }
    MetricSample:
      type: object
      required: [time, cpuPercent, memUsed, memTotal, arcBytes, netRxBps, netTxBps, load1, uptimeSecs]
      properties:
        time: { type: string, format: date-time }
        cpuPercent: { type: number }
        memUsed: { type: integer, description: Bytes used by programs (excludes the reclaimable ZFS cache) }
        memTotal: { type: integer }
        arcBytes: { type: integer, description: ZFS ARC (read cache) size }
        netRxBps: { type: number }
        netTxBps: { type: number }
        load1: { type: number }
        uptimeSecs: { type: number }
    Metrics:
      type: object
      required: [current, history, cpus]
      properties:
        current: { $ref: "#/components/schemas/MetricSample" }
        history: { type: array, items: { $ref: "#/components/schemas/MetricSample" } }
        cpus: { type: integer }
    InstalledVersion:
      type: object
      required: [dataset, name, version, created, default, running, trying]
      properties:
        dataset: { type: string, examples: ["rpool/ROOT/hardyos-0.1.0"] }
        name: { type: string, examples: ["hardyos-0.1.0"] }
        version: { type: string }
        created: { type: integer, description: Unix seconds }
        default: { type: boolean, description: Starts on a normal restart }
        running: { type: boolean }
        trying: { type: boolean, description: Installed and waiting for its first start }
    PendingUpdate:
      type: object
      required: [bootEnvironment, dataset, version, fromBootEnvironment, fromVersion, stagedAt]
      properties:
        bootEnvironment: { type: string }
        dataset: { type: string }
        version: { type: string }
        fromBootEnvironment: { type: string }
        fromVersion: { type: string }
        stagedAt: { type: string, format: date-time }
        snapshot: { type: string }
        notes: { type: string }
    UpdateResult:
      type: object
      required: [ok, version, message, at]
      properties:
        ok: { type: boolean }
        version: { type: string }
        message: { type: string }
        at: { type: string, format: date-time }
    UpdateStatus:
      type: object
      required: [running, versions, pending, last, restoreOnBoot, managed]
      properties:
        running: { type: string }
        versions: { type: array, items: { $ref: "#/components/schemas/InstalledVersion" } }
        pending:
          oneOf:
            - { $ref: "#/components/schemas/PendingUpdate" }
            - { type: "null" }
        last:
          oneOf:
            - { $ref: "#/components/schemas/UpdateResult" }
            - { type: "null" }
        restoreOnBoot: { type: boolean }
        managed: { type: boolean, description: False when not installed with the HardyOS installer }
    InstallerStatus:
      type: object
      required: [active, unlocked]
      properties:
        active: { type: boolean, description: This server is running the live installer }
        unlocked: { type: boolean, description: This browser entered the console code }
        version: { type: string, description: The HardyOS version that will be installed }
        job: { $ref: "#/components/schemas/Job" }
    InstallerNIC:
      type: object
      required: [name, mac, speedMbps, up, driver, addresses]
      properties:
        name: { type: string }
        mac: { type: string }
        speedMbps: { type: integer }
        up: { type: boolean }
        driver: { type: string }
        addresses: { type: array, items: { type: string }, description: Current addresses in CIDR form }
    InstallerHardware:
      type: object
      required: [disks, nics, memBytes, cpu, virtual, hostname]
      properties:
        disks: { type: array, items: { $ref: "#/components/schemas/Disk" } }
        nics: { type: array, items: { $ref: "#/components/schemas/InstallerNIC" } }
        memBytes: { type: integer }
        cpu: { type: string }
        virtual: { type: boolean }
        hostname: { type: string }
    InstallNetwork:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [dhcp, static] }
        interface: { type: string }
        address: { type: string, description: CIDR, like 192.168.1.20/24 }
        gateway: { type: string }
        dns: { type: array, items: { type: string } }
    InstallPlan:
      type: object
      required: [disks, hostname, timezone, network]
      properties:
        disks:
          type: array
          items: { type: string }
          description: Boot disks (by-id paths); two or more are mirrored
        hostname: { type: string }
        timezone: { type: string, examples: ["America/Chicago"] }
        network: { $ref: "#/components/schemas/InstallNetwork" }
    InstallCheck:
      type: object
      required: [version, bootEnvironment, disks]
      properties:
        version: { type: string }
        bootEnvironment: { type: string }
        disks:
          type: array
          items:
            type: object
            required: [disk, warnings]
            properties:
              disk: { $ref: "#/components/schemas/Disk" }
              warnings: { type: array, items: { type: string } }
    InstallRequest:
      type: object
      required: [plan, admin, confirmWipe]
      properties:
        plan: { $ref: "#/components/schemas/InstallPlan" }
        admin:
          type: object
          required: [username, password]
          properties:
            username: { type: string }
            displayName: { type: string }
            password: { type: string, minLength: 10 }
        confirmWipe: { type: boolean, description: Must be true; the boot disks are erased }
    Error:
      type: object
      description: Body of every non-2xx response
      required: [code, message]
      properties:
        code: { type: string, description: Stable machine-readable error code }
        message: { type: string, description: Human-readable explanation }
        details:
          type: array
          items: { type: string }
          description: Every problem, when a form has several
    NetworkAddressing:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [dhcp, static, "off", member]
          description: member is set by the server for bond members
        address: { type: string, description: "Static only: CIDR, like 192.168.1.20/24" }
        gateway: { type: string, description: Static only, optional }
        mtu: { type: integer, description: 0 or absent for the default 1500 }
    NetworkInterface:
      allOf:
        - $ref: "#/components/schemas/NetworkAddressing"
        - type: object
          required: [name]
          properties:
            name: { type: string }
    NetworkBond:
      allOf:
        - $ref: "#/components/schemas/NetworkAddressing"
        - type: object
          required: [name, members, policy]
          properties:
            name: { type: string, description: bond0 to bond99 }
            members: { type: array, items: { type: string } }
            policy: { type: string, enum: [active-backup, 802.3ad, balance-alb] }
    NetworkVLAN:
      allOf:
        - $ref: "#/components/schemas/NetworkAddressing"
        - type: object
          required: [parent, id]
          properties:
            parent: { type: string, description: Port or bond }
            id: { type: integer, minimum: 1, maximum: 4094 }
    NetworkConfig:
      type: object
      required: [hostname, dns, search, interfaces, bonds, vlans]
      properties:
        hostname: { type: string }
        dns: { type: array, items: { type: string } }
        search: { type: array, items: { type: string } }
        interfaces: { type: array, items: { $ref: "#/components/schemas/NetworkInterface" } }
        bonds: { type: array, items: { $ref: "#/components/schemas/NetworkBond" } }
        vlans: { type: array, items: { $ref: "#/components/schemas/NetworkVLAN" } }
    LiveInterface:
      type: object
      required: [name, kind, mac, up, carrier, speedMbps, addresses]
      properties:
        name: { type: string }
        kind: { type: string, enum: [port, bond, vlan, other] }
        mac: { type: string }
        up: { type: boolean }
        carrier: { type: boolean, description: A cable is connected and the link is up }
        speedMbps: { type: integer }
        addresses: { type: array, items: { type: string } }
    NetworkPending:
      type: object
      required: [appliedAt, deadline, addresses]
      properties:
        appliedAt: { type: string, format: date-time }
        deadline: { type: string, format: date-time, description: Undone automatically after this unless confirmed }
        addresses: { type: array, items: { type: string }, description: Fixed addresses the server will have }
    NetworkStatus:
      type: object
      required: [config, ports, live, pending, gateway, dns, lastRevert]
      properties:
        config: { $ref: "#/components/schemas/NetworkConfig" }
        ports: { type: array, items: { type: string } }
        live: { type: array, items: { $ref: "#/components/schemas/LiveInterface" } }
        pending:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/NetworkPending" }]
        gateway: { type: string }
        dns: { type: array, items: { type: string } }
        lastRevert:
          nullable: true
          type: object
          required: [at, reason]
          properties:
            at: { type: string, format: date-time }
            reason: { type: string }
    TimeConfig:
      type: object
      required: [timezone, ntp, ntpServers]
      properties:
        timezone: { type: string, description: "IANA name, like America/Denver" }
        ntp: { type: boolean, description: Keep the clock right over the network }
        ntpServers: { type: array, items: { type: string }, description: Empty uses the Debian pool }
    TimeStatus:
      allOf:
        - $ref: "#/components/schemas/TimeConfig"
        - type: object
          required: [now, synced, source, offsetSec]
          properties:
            now: { type: string, format: date-time }
            synced: { type: boolean }
            source: { type: string }
            offsetSec: { type: number }
    AvailableUpdate:
      type: object
      required: [version, name, notes, url, pageUrl, size, publishedAt]
      properties:
        version: { type: string }
        name: { type: string }
        notes: { type: string, description: Release notes (Markdown) }
        url: { type: string, description: The signed update file }
        pageUrl: { type: string, description: The release page on GitHub }
        size: { type: integer, format: int64 }
        publishedAt: { type: string, format: date-time }
    UpdateCheck:
      type: object
      required: [autoCheck, current, lastCheck, lastError, available]
      properties:
        autoCheck: { type: boolean, description: Check GitHub for new versions daily }
        current: { type: string, description: The running version }
        lastCheck: { type: string, format: date-time, nullable: true }
        lastError: { type: string, description: Why the last check failed (empty when it worked) }
        available:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/AvailableUpdate" }]
    BackupSettings:
      type: object
      required: [nightly, pool, keep, time]
      properties:
        nightly: { type: boolean }
        pool: { type: string, description: Empty for the first data pool }
        keep: { type: integer, minimum: 1, maximum: 365 }
        time: { type: string, description: "HH:MM in the server's time zone" }
    BackupManifest:
      type: object
      required: [format, createdAt, version, hostname, schema, secrets, entries, users]
      properties:
        format: { type: integer }
        createdAt: { type: string, format: date-time }
        version: { type: string }
        hostname: { type: string }
        schema: { type: integer }
        secrets: { type: boolean }
        users: { type: integer }
        note: { type: string }
        entries:
          type: array
          items:
            type: object
            required: [path, size, sha256]
            properties:
              path: { type: string }
              size: { type: integer, format: int64 }
              sha256: { type: string }
    PoolBackup:
      type: object
      required: [pool, name, size, manifest]
      properties:
        pool: { type: string }
        name: { type: string }
        size: { type: integer, format: int64 }
        manifest: { $ref: "#/components/schemas/BackupManifest" }
    BackupStaged:
      type: object
      required: [manifest, stagedAt]
      properties:
        manifest: { $ref: "#/components/schemas/BackupManifest" }
        stagedAt: { type: string, format: date-time }
    RestoreResult:
      type: object
      required: [ok, at, message, notes, from]
      properties:
        ok: { type: boolean }
        at: { type: string, format: date-time }
        message: { type: string }
        notes: { type: array, items: { type: string } }
        from: { type: string, format: date-time }
    BackupStatus:
      type: object
      required: [settings, pools, backups, lastRun, lastError, pending, lastResult]
      properties:
        settings: { $ref: "#/components/schemas/BackupSettings" }
        pools: { type: array, items: { type: string } }
        backups: { type: array, items: { $ref: "#/components/schemas/PoolBackup" } }
        lastRun: { type: string, format: date-time, nullable: true }
        lastError: { type: string }
        pending:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/BackupStaged" }]
        lastResult:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/RestoreResult" }]
    BackupDownload:
      type: object
      required: [name, file, size]
      properties:
        name: { type: string }
        file: { type: string }
        size: { type: integer, format: int64 }
    RestoreSource:
      type: object
      properties:
        upload: { type: string, description: From /system/backups/upload }
        pool: { type: string }
        name: { type: string }
        password: { type: string }
    BootDisks:
      type: object
      required: [pool, status, disks, candidates, minBytes]
      properties:
        pool: { type: string }
        status: { $ref: "#/components/schemas/PoolStatus" }
        disks:
          type: array
          items:
            type: object
            required: [byId, espPartUUID]
            properties:
              byId: { type: string }
              espPartUUID: { type: string }
        candidates: { type: array, items: { $ref: "#/components/schemas/Disk" } }
        minBytes: { type: integer, format: int64, description: The smallest disk that can join }
    TerminalSettings:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    Enabled:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    # ---- Shared folders ----------------------------------------------------
    ShareRule:
      type: object
      required: [kind, level]
      properties:
        kind: { type: string, enum: [user, group, everyone] }
        name: { type: string, description: "HOME\\alice, HOME\\Family or a HardyOS account; empty for everyone" }
        level: { type: string, enum: [read, write, none] }
    ShareAppGrant:
      type: object
      required: [app, uid, level]
      properties:
        app: { type: string }
        uid: { type: integer, description: The app's own Linux user ID }
        level: { type: string, enum: [read, write] }
    Share:
      type: object
      required: [id, name, description, pool, dataset, path, mounted, quotaBytes, usedBytes, recycle, guest, access, apps, createdAt, services]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        pool: { type: string }
        dataset: { type: string }
        path: { type: string, description: Where it is on the server }
        mounted: { type: boolean }
        quotaBytes: { type: integer, format: int64, description: 0 for no quota }
        usedBytes: { type: integer, format: int64 }
        recycle: { type: boolean, description: Deleted files go to a recycle bin (with file sharing) }
        guest: { type: boolean, description: Guests may read it without signing in (with file sharing) }
        access:
          type: array
          description: Who may use it; empty means administrators only. Enforced with file sharing.
          items: { $ref: "#/components/schemas/ShareRule" }
        apps: { type: array, items: { $ref: "#/components/schemas/ShareAppGrant" } }
        createdAt: { type: string, format: date-time }
        services: { $ref: "#/components/schemas/ShareServices" }
    ShareServices:
      type: object
      description: How the folder is shared on the network, and its automatic snapshots
      required: [smb, nfs, snapshots, sftp, webdav]
      properties:
        smb:
          type: object
          required: [enabled, timeMachine, timeMachineMaxBytes, previousVersions]
          properties:
            enabled: { type: boolean, description: Windows and Mac file sharing (SMB) }
            timeMachine: { type: boolean, description: Macs can back up here with Time Machine }
            timeMachineMaxBytes: { type: integer, format: int64, description: Most each Mac's backups may use; 0 = the folder's quota }
            previousVersions: { type: boolean, description: Snapshots show in Windows' Previous Versions }
        nfs:
          type: object
          required: [enabled, clients]
          properties:
            enabled: { type: boolean }
            clients:
              type: array
              items:
                type: object
                required: [client, access]
                properties:
                  client: { type: string, description: "An address or network, like 192.168.1.50 or 192.168.1.0/24" }
                  access: { type: string, enum: [read, write] }
        snapshots:
          type: object
          description: How many automatic snapshots to keep; 0 turns that kind off
          required: [hourly, daily, weekly, monthly]
          properties:
            hourly: { type: integer }
            daily: { type: integer }
            weekly: { type: integer }
            monthly: { type: integer }
        sftp: { type: boolean, description: "Offered to domain accounts over SFTP (with File Services' SFTP on). Off for new folders" }
        webdav: { type: boolean, description: "Offered to domain accounts at https://<server>/dav/ (with File Services' WebDAV on). Off for new folders" }
    ShareCreateRequest:
      type: object
      required: [pool, name]
      properties:
        pool: { type: string }
        name: { type: string, description: "1-40 letters, digits, spaces and . - _ ( ) ' &" }
        id: { type: string, description: "Defaults to one made from the name (Media -> media)" }
        description: { type: string }
        quotaBytes: { type: integer, format: int64, description: 0 for no quota }
        recycle: { type: boolean }
        guest: { type: boolean }
        access: { type: array, items: { $ref: "#/components/schemas/ShareRule" } }
        subfolders: { type: array, items: { type: string } }
        services: { $ref: "#/components/schemas/ShareServices" }
    ShareUpdateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        quotaBytes: { type: integer, format: int64, description: 0 removes the quota }
        recycle: { type: boolean }
        guest: { type: boolean }
        access: { type: array, items: { $ref: "#/components/schemas/ShareRule" } }
        services: { $ref: "#/components/schemas/ShareServices" }
    ShareStarterRequest:
      type: object
      required: [pool, media, backups]
      properties:
        pool: { type: string }
        media: { type: boolean, description: Media with Movies, TV, Music and Photos }
        backups: { type: boolean }
    # ---- end of shared folders ---------------------------------------------
    # ---- Shared folder snapshots and NFS (file sharing part B) --------------
    ShareSnapshot:
      type: object
      required: [name, kind, createdAt, usedBytes, referBytes]
      properties:
        name: { type: string, example: hardyos-auto-daily_2026-10-26-0000 }
        kind:
          type: string
          enum: [hourly, daily, weekly, monthly, manual, other]
          description: Automatic kind, manual (taken from HardyOS) or other (made outside HardyOS)
        createdAt: { type: string, format: date-time }
        usedBytes: { type: integer, format: int64, description: Space only this snapshot holds (freed by deleting it) }
        referBytes: { type: integer, format: int64, description: Size of the folder as it was }
    ShareNFS:
      type: object
      required: [enabled, path, uid, running]
      properties:
        enabled: { type: boolean }
        path: { type: string, description: The path to mount, like /mnt/tank/shares/media }
        uid: { type: integer, description: "The folder's NFS identity (31000-31999); every client acts as it. 0 until NFS is first turned on" }
        running: { type: boolean, description: The NFS server runs }
        problem: { type: string, description: The last NFS sync's error, if any }
    # ---- end of shared folder snapshots and NFS -----------------------------
    # ---- File Services: SMB file server (file sharing part A) -------------
    FileServicesDomain:
      type: object
      required: [domain, realm, netbios]
      properties:
        domain: { type: string, example: home.hardynetworks.net }
        realm: { type: string }
        netbios: { type: string, example: HOME }
        dcs: { type: array, items: { type: string }, description: "Domain controllers used first (this server's own)" }
        adminsGroupSid: { type: string }
    FileServicesHomes:
      type: object
      required: [enabled, pool, quotaBytes]
      properties:
        enabled: { type: boolean, description: A home folder for every domain account }
        pool: { type: string, description: "Where they're kept (<pool>/homes)" }
        quotaBytes: { type: integer, format: int64, description: "Each home folder's quota; 0 for none" }
    FileServicesSettings:
      type: object
      required: [smbEnabled, homes, sftpEnabled, webdavEnabled]
      properties:
        smbEnabled: { type: boolean }
        homes: { $ref: "#/components/schemas/FileServicesHomes" }
        sftpEnabled: { type: boolean, description: SFTP for domain accounts (folders with SFTP on, and Home) }
        sftpAdmins: { type: boolean, description: "Domain administrators (Domain Admins, HardyOS Admins) may use SFTP too; off by default, so they get no view and their passwords are never tried over SSH" }
        webdavEnabled: { type: boolean, description: "WebDAV at https://<server>/dav/ for domain accounts (folders with WebDAV on, and Home)" }
    FileServicesShare:
      type: object
      required: [id, name, smb, timeMachine, previousVersions, recycle, guest, sftp, webdav, available, skipped]
      properties:
        id: { type: string }
        name: { type: string }
        smb: { type: boolean }
        timeMachine: { type: boolean }
        previousVersions: { type: boolean }
        recycle: { type: boolean }
        guest: { type: boolean }
        sftp: { type: boolean }
        webdav: { type: boolean }
        available: { type: boolean, description: Offered over SMB right now }
        skipped: { type: array, items: { type: string }, description: "Access rules that can't apply here (a HardyOS account, another domain's name)" }
    FileServicesStatus:
      type: object
      required: [available, joined, domain, localDomain, serverName, hostName, running, winbind, problem, settings, shares, addresses]
      properties:
        available: { type: boolean, description: This build has the SMB file server }
        joined: { type: boolean, description: This server is a member of the domain }
        domain:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/FileServicesDomain" }]
        localDomain: { type: string, description: "The domain this server's own DC runs (empty: none)" }
        serverName: { type: string, example: HARDYOS, description: "Its name on the network" }
        hostName: { type: string, example: hardyos.home.hardynetworks.net }
        running: { type: boolean, description: The SMB server is running }
        winbind: { type: boolean, description: "The domain answers (accounts can sign in)" }
        problem: { type: string }
        settings: { $ref: "#/components/schemas/FileServicesSettings" }
        shares: { type: array, items: { $ref: "#/components/schemas/FileServicesShare" } }
        addresses: { type: array, items: { type: string }, description: "This server's LAN addresses" }
        joinedAt: { type: string, format: date-time }
        sftp: { $ref: "#/components/schemas/FileServicesSFTP" }
    FileServicesJoinRequest:
      type: object
      required: [adminPassword]
      properties:
        domain: { type: string, description: "The domain's DNS name; leave out for this server's own domain" }
        adminUser: { type: string, description: Defaults to Administrator }
        adminPassword: { type: string, format: password }
    FileServicesLeaveRequest:
      type: object
      required: [confirm]
      properties:
        confirm: { type: boolean, description: Must be true }
        adminUser: { type: string }
        adminPassword: { type: string, format: password, description: "With it, the computer account is deleted from the domain too" }
    FileServicesSettingsRequest:
      type: object
      properties:
        smbEnabled: { type: boolean }
        homes: { $ref: "#/components/schemas/FileServicesHomes" }
        sftpEnabled: { type: boolean }
        sftpAdmins: { type: boolean }
        webdavEnabled: { type: boolean }
    # ---- end of File Services ------------------------------------------------
    # ---- SFTP and WebDAV (file sharing part E) ------------------------------
    # WebDAV itself is served at /dav/ (outside /api/v1, HTTP Basic sign-in
    # with a domain account over HTTPS; see docs/file-sharing.md), so it has
    # no paths here: File Services' settings and each folder's services turn
    # it and SFTP on.
    FileServicesSFTP:
      type: object
      required: [enabled, running, users, folders, port, problem]
      properties:
        enabled: { type: boolean }
        running: { type: boolean, description: "The SSH server runs (HardyOS doesn't start or stop it)" }
        users: { type: integer, description: Domain accounts that have something to see over SFTP }
        folders: { type: integer, description: Folders offered in all their views together }
        port: { type: integer, example: 22 }
        problem: { type: string }
    # ---- end of SFTP and WebDAV ----------------------------------------------
    DomainConfig:
      type: object
      required: [domain, realm, netbios, dcName, address, gateway, parent, mac, forwarders, enabled, createdAt]
      properties:
        domain: { type: string, example: home.hardynetworks.net }
        realm: { type: string, example: HOME.HARDYNETWORKS.NET }
        netbios: { type: string, example: HOME }
        dcName: { type: string, example: dc1.home.hardynetworks.net }
        address: { type: string, description: The domain controller's address (CIDR) }
        gateway: { type: string }
        parent: { type: string, description: The NAS interface the domain controller sits on }
        mac: { type: string }
        forwarders: { type: array, items: { type: string } }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        host: { type: string, description: "This DC's short name (dc1, dc2…)" }
        joined: { type: boolean, description: This DC joined an existing domain }
        adminsGroupSid:
          type: string
          description: >-
            objectSid of the HardyOS Admins group, recorded when HardyOS created
            it or an administrator adopted an existing one; its members are
            HardyOS administrators whatever the group is called now. Absent
            until then.
        others:
          type: array
          description: The domain's other domain controllers
          items: { $ref: "#/components/schemas/DomainController" }
    DomainController:
      type: object
      required: [name, address]
      properties:
        name: { type: string, example: dc2.home.hardynetworks.net }
        address: { type: string }
    DomainJoinRequest:
      type: object
      required: [domain, existing, adminPassword, address]
      properties:
        domain: { type: string }
        existing: { type: string, description: Address of one of the domain's domain controllers }
        adminPassword: { type: string, format: password, description: The domain's Administrator password }
        address: { type: string, description: This domain controller's own address }
        gateway: { type: string }
        forwarders: { type: array, items: { type: string } }
    DomainStatus:
      type: object
      required: [provisioned, config, running, responding, problem, available]
      properties:
        provisioned: { type: boolean }
        config:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/DomainConfig" }]
        running: { type: boolean }
        responding: { type: boolean, description: The domain controller answered a DNS query for the domain from the NAS }
        problem: { type: string, description: Why the domain controller isn't working, or empty }
        available: { type: boolean, description: False when this build has no Samba }
    DomainSuggestion:
      type: object
      required: [parent, hostAddress, gateway, dns, address]
      properties:
        parent: { type: string }
        hostAddress: { type: string }
        gateway: { type: string }
        dns: { type: array, items: { type: string } }
        address: { type: string, description: A free address for the domain controller (CIDR), or empty }
    DomainProvisionRequest:
      type: object
      required: [domain, adminPassword, address]
      properties:
        domain: { type: string, description: DNS name of the domain, e.g. home.yourname.net }
        netbios: { type: string, description: Short (pre-Windows 2000) name; defaults to the first part of the domain }
        adminPassword: { type: string, format: password, description: Password for the domain's Administrator account }
        address: { type: string, description: The domain controller's address, CIDR or a plain IP on the NAS's network }
        gateway: { type: string }
        forwarders: { type: array, items: { type: string }, description: DNS servers for names outside the domain }
    DomainUser:
      type: object
      required: [username, givenName, surname, displayName, email, enabled, lockedOut, mustChangePassword, groups, created, lastLogon, builtin]
      properties:
        username: { type: string }
        givenName: { type: string }
        surname: { type: string }
        displayName: { type: string }
        email: { type: string }
        enabled: { type: boolean }
        lockedOut: { type: boolean }
        mustChangePassword: { type: boolean }
        groups: { type: array, items: { type: string } }
        created: { type: string }
        lastLogon: { type: integer, format: int64, description: Unix seconds; 0 means never }
        builtin: { type: boolean }
    DomainNewUser:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        givenName: { type: string }
        surname: { type: string }
        email: { type: string }
        password: { type: string, format: password }
        mustChangePassword: { type: boolean }
        groups: { type: array, items: { type: string } }
    DomainGroup:
      type: object
      required: [name, description, members, builtin]
      properties:
        name: { type: string }
        sid: { type: string, description: "The group's objectSid; it stays when the group is renamed" }
        description: { type: string }
        members: { type: array, items: { type: string } }
        builtin: { type: boolean }
    DomainAdminsGroup:
      type: object
      required: [name, sid, members, created, adopted]
      properties:
        name: { type: string }
        sid: { type: string }
        members: { type: array, items: { type: string } }
        created: { type: boolean, description: HardyOS created the group just now }
        adopted: { type: boolean, description: An existing group was recorded }
    AppsOverview:
      type: object
      required: [available, configured, pool, engineRunning, engineVersion, problem, apps, keptData, updates, published]
      properties:
        published:
          type: object
          additionalProperties: { type: string }
          description: "Apps published through NetBird's reverse proxy: id to https://<app>.<base>/"
        available: { type: boolean, description: False when this build has no Docker }
        configured: { type: boolean, description: Docker has been set up on a pool }
        pool: { type: string, description: The pool holding Docker and every app }
        engineRunning: { type: boolean }
        engineVersion: { type: string }
        problem: { type: string, description: Why the apps can't run right now, if they can't }
        apps: { type: array, items: { $ref: "#/components/schemas/App" } }
        keptData:
          type: array
          description: Apps removed with their data kept; installing again picks it back up
          items:
            type: object
            required: [id, name, dataset]
            properties:
              id: { type: string }
              name: { type: string }
              dataset: { type: string }
        updates:
          type: object
          description: Newer catalog versions, by app id
          additionalProperties: { type: string }
    App:
      type: object
      required: [id, name, version, summary, publisher, website, icon, dataset, state, containers, ports, web, installedAt, updatedAt,
        source, sourceName, uid, shares, grants, limits, permissions]
      properties:
        source: { $ref: "#/components/schemas/AppSource" }
        sourceName: { type: string, description: The imported catalog's name (source imported) }
        uid: { type: integer, description: The app's own Linux user ID (30000-30999) }
        shares:
          type: array
          description: "Every shared folder the app declares; an empty share = none chosen"
          items: { $ref: "#/components/schemas/AppShare" }
        grants: { type: array, items: { type: string }, description: Extra permissions an administrator allowed }
        limits: { $ref: "#/components/schemas/AppLimits" }
        permissions: { type: array, items: { type: string }, description: What the app may do beyond a plain container, in plain words }
        blocked:
          type: string
          description: >-
            Why the app can't start until an administrator changes its settings
            (a rollback brought back a version that needs a permission or shared
            folder it doesn't have now). Saving the settings with what's
            missing clears it. Absent otherwise.
        id: { type: string }
        name: { type: string }
        version: { type: string }
        summary: { type: string }
        publisher: { type: string }
        website: { type: string }
        icon: { type: string, description: A data URL }
        dataset: { type: string }
        state:
          type: string
          enum: [running, starting, unhealthy, partial, stopped, restarting, not-created]
        containers:
          type: array
          items:
            type: object
            required: [service, state, health, status, image]
            properties:
              service: { type: string }
              state: { type: string }
              health: { type: string }
              status: { type: string }
              image: { type: string }
        ports:
          type: array
          items:
            type: object
            required: [name, label, port, protocol]
            properties:
              name: { type: string }
              label: { type: string }
              port: { type: integer }
              protocol: { type: string, enum: [tcp, udp] }
        web:
          nullable: true
          type: object
          required: [port, path, scheme]
          properties:
            port: { type: integer }
            path: { type: string }
            scheme: { type: string, enum: [http, https] }
        installedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AppPackage:
      type: object
      required: [source, ref, sourceName, id, name, version, summary, description, publisher, website, icon, minMemoryMB, ports, settings, permissions,
        grants, shares, fixedPorts, images]
      properties:
        source: { $ref: "#/components/schemas/AppSource" }
        ref: { type: string, description: The app id (catalog) or the package's SHA-256 (upload, imported, custom) }
        sourceName: { type: string, description: The imported catalog's name (source imported) }
        catalogId: { type: integer, format: int64, description: The imported catalog's id (source imported); send it back with the ref }
        grants:
          type: array
          description: |
            Extra permissions the package asks for. Catalog apps get them by
            declaring them; any other source needs each one in the install's
            `grants`.
          items: { $ref: "#/components/schemas/AppEntryGrant" }
        shares: { type: array, items: { $ref: "#/components/schemas/AppShareMount" } }
        fixedPorts: { type: boolean, description: The app uses the host network, so its ports can't change }
        id: { type: string }
        name: { type: string }
        version: { type: string }
        summary: { type: string }
        description: { type: string }
        publisher: { type: string }
        website: { type: string }
        icon: { type: string, description: A data URL }
        minMemoryMB: { type: integer }
        ports:
          type: array
          items:
            type: object
            required: [name, label, default, protocol, web]
            properties:
              name: { type: string }
              label: { type: string }
              default: { type: integer }
              protocol: { type: string, enum: [tcp, udp] }
              web: { type: boolean, description: The app's web page is on this port }
        settings:
          type: array
          description: Settings the install form asks for (generated passwords aren't listed)
          items:
            type: object
            required: [env, label, help, type, default, options, required]
            properties:
              env: { type: string }
              label: { type: string }
              help: { type: string }
              type: { type: string, enum: [text, number, boolean, select, password] }
              default: { type: string }
              options: { type: array, items: { type: string } }
              required: { type: boolean }
        permissions:
          type: array
          description: What the app may do beyond a plain container, in plain words
          items: { type: string }
        images: { type: array, items: { type: string } }
    AppPackageRef:
      type: object
      required: [source, ref]
      properties:
        source: { $ref: "#/components/schemas/AppSource" }
        ref: { type: string }
        catalogId:
          type: integer
          format: int64
          description: The imported catalog the package is from (required for source imported); it must list that SHA-256
    AppPlan:
      type: object
      required: [package, ports, pools, enginePool, installed, installedVersion, keptData, installedSource, installedSourceName,
        replaceSourceRequired, available, problem]
      properties:
        package: { $ref: "#/components/schemas/AppPackage" }
        ports:
          type: object
          description: A free port for each of the app's ports
          additionalProperties: { type: integer }
        pools: { type: array, items: { type: string }, description: Pools to choose from the first time (when enginePool is empty) }
        enginePool: { type: string }
        installed: { type: boolean }
        installedVersion: { type: string }
        keptData: { type: boolean, description: The app's data was kept when it was removed and will be picked back up }
        installedSource: { type: string, description: "Where the installed (or kept) app with this id came from; empty when none or unknown" }
        installedSourceName: { type: string, description: The imported catalog it came from (installedSource imported) }
        replaceSourceRequired:
          type: boolean
          description: >-
            This package is from another source or imported catalog than the
            installed (or kept) app with the same id, and would take over its
            data and passwords: the install must send replaceSource true.
        available: { type: boolean }
        problem: { type: string }
    AppInstallRequest:
      type: object
      required: [source, ref]
      properties:
        source: { $ref: "#/components/schemas/AppSource" }
        ref: { type: string }
        catalogId: { type: integer, format: int64, description: The imported catalog (source imported) }
        replaceSource:
          type: boolean
          description: Confirms replacing an installed or kept app with the same id from another source or catalog (AppPlan.replaceSourceRequired)
        pool: { type: string, description: The pool for Docker and every app; only needed the first time }
        ports:
          type: object
          additionalProperties: { type: integer }
        settings:
          type: object
          additionalProperties: { type: string }
        shares:
          type: object
          description: The shared folder for each of the package's shares, by share name
          additionalProperties: { $ref: "#/components/schemas/AppShareChoice" }
        grants:
          type: array
          description: Extra permissions an administrator ticked (non-catalog apps only; each is audited)
          items: { type: string }
        limits: { $ref: "#/components/schemas/AppLimits" }
        access:
          type: array
          description: Who may use the app; omitted or empty = everyone signed in
          items: { $ref: "#/components/schemas/AppPrincipal" }
    AppRemoveRequest:
      type: object
      required: [confirm]
      properties:
        confirm: { type: string, description: The app's name, typed to confirm }
        deleteData: { type: boolean, description: Delete the app's files and database too }
    # ---- App Store v2 schemas (apps API and web) ----
    AppSource:
      type: string
      enum: [catalog, upload, imported, custom]
      description: "Where a package came from: HardyOS's catalog, an upload, an imported catalog, or made from a Compose file"
    AppShareMount:
      type: object
      required: [name, label, access]
      properties:
        name: { type: string, description: "MEDIA: the Compose file binds ${HARDY_SHARE_MEDIA}" }
        label: { type: string }
        help: { type: string }
        access: { type: string, enum: [read, write], description: The most the app gets }
        suggest: { type: string, description: Shared folder id to preselect }
        required: { type: boolean }
    AppShareChoice:
      type: object
      required: [share]
      properties:
        share: { type: string, description: "Shared folder id; empty = none" }
        path: { type: string, description: "Always empty: apps get whole shared folders (a subfolder could be swapped for a link)" }
        access: { type: string, enum: [read, write] }
    AppShare:
      type: object
      required: [name, label, share, path, access]
      properties:
        name: { type: string }
        label: { type: string }
        share: { type: string }
        path: { type: string }
        access: { type: string }
    AppLimits:
      type: object
      required: [memoryMB, cpus]
      properties:
        memoryMB: { type: integer, description: 0 = no limit }
        cpus: { type: number, description: 0 = no limit }
    AppEntryGrant:
      type: object
      required: [grant, label]
      properties:
        grant: { type: string, description: "hostNetwork, gpu, device:/dev/... or cap:NAME" }
        label: { type: string }
    AppPrincipal:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string, enum: [user, group, everyone] }
        name: { type: string, description: "alice (HardyOS), HOME\\alice (domain user), HOME\\Family (domain group); empty for everyone" }
    AppAccess:
      type: object
      required: [principals]
      properties:
        principals: { type: array, items: { $ref: "#/components/schemas/AppPrincipal" } }
    AppSettingValue:
      type: object
      required: [env, value, set]
      properties:
        env: { type: string }
        value: { type: string, description: Empty for passwords }
        set: { type: boolean }
    AppConfig:
      type: object
      required: [id, source, sourceName, uid, manifest, ports, settings, shares, grants, limits, package]
      properties:
        id: { type: string }
        source: { $ref: "#/components/schemas/AppSource" }
        sourceName: { type: string }
        uid: { type: integer }
        manifest: { type: object, additionalProperties: true, description: The installed hardyapp.json }
        ports: { type: object, additionalProperties: { type: integer } }
        settings: { type: array, items: { $ref: "#/components/schemas/AppSettingValue" } }
        shares: { type: array, items: { $ref: "#/components/schemas/AppShare" } }
        grants: { type: array, items: { type: string } }
        limits: { $ref: "#/components/schemas/AppLimits" }
        package: { $ref: "#/components/schemas/AppPackage" }
    AppConfigUpdate:
      type: object
      properties:
        ports: { type: object, additionalProperties: { type: integer } }
        settings: { type: object, additionalProperties: { type: string } }
        shares: { type: object, additionalProperties: { $ref: "#/components/schemas/AppShareChoice" } }
        grants: { type: array, items: { type: string } }
        limits: { $ref: "#/components/schemas/AppLimits" }
    AppUpdateRequest:
      type: object
      properties:
        source: { $ref: "#/components/schemas/AppSource" }
        ref: { type: string }
        catalogId: { type: integer, format: int64, description: The imported catalog (source imported) }
        replaceSource: { type: boolean, description: Confirms a package from another source or catalog than the app came from }
        grants: { type: array, items: { type: string }, description: Replaces the app's extra permissions (when the new version asks for more) }
    AppGrantsNeeded:
      allOf:
        - { $ref: "#/components/schemas/Error" }
        - type: object
          properties:
            grants: { type: array, items: { $ref: "#/components/schemas/AppEntryGrant" } }
    AppSnapshot:
      type: object
      required: [name, created, version]
      properties:
        name: { type: string }
        created: { type: string, format: date-time }
        version: { type: string, description: The app's version when the snapshot was taken }
    AppSnapshots:
      type: object
      required: [snapshots]
      properties:
        snapshots: { type: array, items: { $ref: "#/components/schemas/AppSnapshot" } }
    AppRollbackRequest:
      type: object
      required: [snapshot, confirm]
      properties:
        snapshot: { type: string }
        confirm: { type: string, description: The app's name, typed to confirm }
    AppOpen:
      type: object
      required: [url, proxied]
      properties:
        url: { type: string }
        proxied: { type: boolean, description: Through HardyOS's HTTPS window proxy (can be shown in a desktop window) }
        published: { type: boolean, description: "The app's own published address (https://<app>.<base>, through NetBird's reverse proxy), given when the desktop is used at its published address" }
    AppCatalogApp:
      type: object
      required: [id, name, version, summary, url, sha256, icon]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        summary: { type: string }
        url: { type: string }
        sha256: { type: string, description: Install with source imported and this as ref }
        icon: { type: string, description: "A data URL, or empty" }
    AppCatalog:
      type: object
      required: [id, url, name, addedAt, addedBy, fetchedAt, lastError, localNetwork, apps]
      properties:
        id: { type: integer, format: int64 }
        url: { type: string }
        name: { type: string }
        addedAt: { type: string, format: date-time }
        addedBy: { type: string }
        fetchedAt: { type: string, format: date-time, nullable: true }
        lastError: { type: string }
        localNetwork: { type: boolean, description: '"On my network": the catalog may be on this server or its own networks' }
        apps: { type: array, items: { $ref: "#/components/schemas/AppCatalogApp" } }
    AppCatalogRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, description: "https:// address of the catalog's index.json" }
        localNetwork:
          type: boolean
          description: >-
            "On my network": allow this catalog on this server or its own
            networks (refused otherwise). Omitted keeps a refreshed catalog's
            setting.
    AppCatalogRemoveRequest:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64 }
    CustomAppPort:
      type: object
      required: [name, label, default]
      properties:
        name: { type: string, description: "WEB: published as ${HARDY_PORT_WEB}" }
        label: { type: string }
        default: { type: integer }
        protocol: { type: string, enum: [tcp, udp] }
    CustomAppFolder:
      type: object
      required: [path]
      properties:
        path: { type: string, description: "Inside ${HARDY_APP_DATA}" }
        owner: { type: string, description: "uid:gid" }
        mode: { type: string, description: "Octal, like 0755" }
    CustomAppRequest:
      type: object
      required: [id, name, compose, ports]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string, description: Default 1.0.0 }
        summary: { type: string }
        compose: { type: string }
        ports: { type: array, items: { $ref: "#/components/schemas/CustomAppPort" } }
        webPort: { type: string, description: The port with the app's web page }
        webPath: { type: string }
        folders: { type: array, items: { $ref: "#/components/schemas/CustomAppFolder" } }
    # ---- end of App Store v2 schemas ----
    # ---- Share links (part D) ----
    ShareLink:
      type: object
      required: [id, share, path, name, dir, createdById, createdBy, createdAt, expiresAt, hasPassword, allowUpload, maxDownloads, downloadCount, lastUsedAt, revoked, status, maxUploadBytes, uploadedBytes, maxZipBytes]
      properties:
        id: { type: integer, format: int64 }
        share: { type: string, description: 'Shared folder id, or "~home"' }
        path: { type: string, description: Inside the share; empty for all of it }
        name: { type: string, description: The file or folder's name; empty for a whole share }
        dir: { type: boolean }
        createdById: { type: integer, format: int64 }
        createdBy: { type: string, description: "Who made it: alice or HOME\\alice" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        hasPassword: { type: boolean }
        allowUpload: { type: boolean }
        maxDownloads: { type: integer, description: 0 for no limit }
        downloadCount: { type: integer }
        lastUsedAt: { type: [string, "null"], format: date-time }
        revoked: { type: boolean }
        status: { type: string, enum: [active, expired, revoked, used-up] }
        maxUploadBytes: { type: integer, format: int64, description: "What an upload link may take in, in all (bytes); 0 for links without uploads" }
        uploadedBytes: { type: integer, format: int64, description: What it has taken in so far }
        maxZipBytes: { type: integer, format: int64, description: "The most one \"download all\" zip of a folder link holds (bytes)" }
    ShareLinkRequest:
      type: object
      required: [share, path]
      properties:
        share: { type: string }
        path: { type: string }
        expiresInDays: { type: integer, minimum: 1, maximum: 90, description: Default 7 }
        password: { type: string, description: "At least 6 characters; leave out for none" }
        allowUpload: { type: boolean, description: Visitors may add files (folders only) }
        maxDownloads: { type: integer, minimum: 0, description: 0 for no limit }
        maxUploadBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
          description: "Upload links: what the link may take in, in all, 1 MB to 1 TB; 0 or left out for 10 GB. One file is at most 5 GB."
        maxZipBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
          description: "Folder links: the most one \"download all\" zip holds, 1 MB to 1 TB; 0 or left out for 20 GB"
    ShareLinkCreated:
      type: object
      required: [link, url, token]
      properties:
        link: { $ref: "#/components/schemas/ShareLink" }
        url: { type: string, description: '"/s/<token>" on this server; shown once' }
        token: { type: string }
        publicUrl: { type: string, description: "The link at https://files.<base>/s/<token> (through NetBird's reverse proxy, for people without NetBird) while publishing is on; it can take a minute to open the first time" }
    # ---- end of share link schemas ----
    # ---- files API schemas (consumed by File Manager; owned by part C) ----
    FileShare:
      type: object
      required: [id, name, writable, recycle]
      properties:
        id: { type: string, description: 'The shared folder''s id, or "~home"' }
        name: { type: string }
        writable: { type: boolean, description: The person may change things at its top }
        recycle: { type: boolean, description: Deleted items go to its recycle bin }
    FileEntry:
      type: object
      required: [name, path, dir, size, modified, writable]
      properties:
        name: { type: string }
        path: { type: string, description: Inside the share, no leading slash }
        dir: { type: boolean }
        size: { type: integer, format: int64, description: 0 for folders }
        modified: { type: string, format: date-time }
        writable: { type: boolean, description: The person may change or delete it }
    FileListing:
      type: object
      required: [folder, entries, truncated]
      properties:
        folder: { $ref: "#/components/schemas/FileEntry" }
        entries: { type: array, items: { $ref: "#/components/schemas/FileEntry" } }
        truncated: { type: boolean, description: The folder holds more than 50000 entries; not all are listed }
    FileVersion:
      type: object
      required: [snapshot, taken, size, modified, dir]
      properties:
        snapshot: { type: string, examples: ["hardyos-auto-daily_2026-10-24-0000"] }
        taken: { type: string, format: date-time }
        size: { type: integer, format: int64 }
        modified: { type: string, format: date-time }
        dir: { type: boolean }
    FileUpload:
      type: object
      required: [id, share, path, size, received]
      properties:
        id: { type: string }
        share: { type: string }
        path: { type: string }
        size: { type: integer, format: int64 }
        received: { type: integer, format: int64, description: Bytes stored so far (the next chunk's offset) }
        entry: { $ref: "#/components/schemas/FileEntry" }
    FilePathRequest:
      type: object
      required: [share, path]
      properties:
        share: { type: string }
        path: { type: string }
    FilePathResult:
      type: object
      required: [share, path]
      properties:
        share: { type: string }
        path: { type: string }
    FileItemResult:
      type: object
      required: [path, ok]
      properties:
        path: { type: string }
        ok: { type: boolean }
        error: { type: string }
        code: { type: string, enum: [not_found, no_access, exists, not_allowed, full, failed] }
        to: { type: string, description: "Copies and moves: where it went" }
        skipped: { type: boolean, description: "conflict skip: the name was taken" }
        recycled: { type: boolean, description: "Deletes: it went to the recycle bin" }
    FileBulkResult:
      type: object
      required: [done, results, recycled]
      properties:
        done: { type: boolean }
        results: { type: array, items: { $ref: "#/components/schemas/FileItemResult" } }
        recycled: { type: boolean, description: "Deletes: everything deleted went to the recycle bin" }
    FileTransferRequest:
      type: object
      required: [share, paths, toShare, toDir]
      properties:
        share: { type: string }
        paths: { type: array, items: { type: string }, maxItems: 1000 }
        toShare: { type: string, description: Empty for the same share }
        toDir: { type: string, description: The folder they go into; empty for the share's top }
        conflict:
          type: string
          enum: [rename, skip, replace, fail]
          description: "When a name is taken: rename (default: copies \"photo (copy).jpg\", moves \"photo (2).jpg\"), skip, replace (files replaced, folders merged) or fail"
    FileUploadRequest:
      type: object
      required: [share, path, size]
      properties:
        share: { type: string }
        path: { type: string, description: Where the file goes, name included }
        size: { type: integer, format: int64 }
        overwrite: { type: boolean, description: Replace a file that's already there (never a folder) }
        modified: { type: integer, format: int64, description: The file's modification time in ms since 1970 (File.lastModified) }
    # ---- end of files API schemas (part C) ----
    # ---- Remote access schemas (part A) ----
    NetBirdClientStatus:
      type: object
      required: [installed, joined, running, state, connected, peersTotal, peersConnected, managementConnected]
      properties:
        installed: { type: boolean }
        version: { type: string }
        joined: { type: boolean, description: HardyOS joined this server to a NetBird network }
        running: { type: boolean, description: netbird.service is active }
        state:
          type: string
          enum: [not_installed, "off", connecting, connected, needs_login, login_failed, session_expired, idle, unknown]
        connected: { type: boolean }
        ip: { type: string, description: This server's NetBird address }
        network: { type: string, description: The NetBird network (CIDR) }
        fqdn: { type: string }
        peersTotal: { type: integer }
        peersConnected: { type: integer }
        managementUrl: { type: string }
        managementConnected: { type: boolean }
        hostname: { type: string, description: This server's name in NetBird }
        interface: { type: string }
        problem: { type: string }
    RemoteJoinRequest:
      type: object
      required: [managementUrl, setupKey]
      properties:
        managementUrl: { type: string, description: "The NetBird server, https://... (default https://vpn.hardynetworks.net)" }
        setupKey: { type: string, writeOnly: true, description: A setup key from NetBird's dashboard; never stored or shown }
        hostname: { type: string, description: "This server's name in NetBird (default nas)" }
    RemoteLeaveRequest:
      type: object
      required: [confirm]
      properties:
        confirm: { type: string, description: The NetBird server's host name, typed to confirm }
    PublishMode:
      type: string
      enum: ["", "off", netbird, public]
      description: "Empty: follow the default for apps; netbird: NetBird devices only; public: the internet, with sign-in in front"
    PublishAuth:
      type: string
      enum: ["", sso, password, pin, none]
      description: "Public only: sso (NetBird's sign-in, HardyOS's own provider once it's NetBird's identity provider), a shared password or PIN, or none"
    RemoteSettings:
      type: object
      required: [enabled, baseDomain, apiUrl, cluster, desktopName, defaultMode, publicShareLinks, instance, hasToken, tokenUnreadable]
      properties:
        enabled: { type: boolean }
        baseDomain: { type: string, description: "Apps are https://<app>.<baseDomain>" }
        apiUrl: { type: string, description: NetBird's API address (empty for the management URL) }
        cluster: { type: string, description: The proxy cluster the base domain is served by }
        desktopName: { type: string }
        defaultMode: { type: string, enum: ["off", netbird, public] }
        publicShareLinks: { type: boolean, description: "files.<base> stays published even with no active share link" }
        instance: { type: string, description: "This server's tag in its NetBird service names (hardyos-<instance>-...)" }
        hasToken: { type: boolean }
        tokenUnreadable: { type: boolean, description: A saved token can't be read on this server (restored from another one) }
    RemotePublishingRequest:
      type: object
      required: [enabled, baseDomain]
      properties:
        enabled: { type: boolean }
        baseDomain: { type: string }
        apiUrl: { type: string }
        cluster: { type: string }
        desktopName: { type: string }
        defaultMode: { type: string, enum: ["", "off", netbird, public] }
        publicShareLinks: { type: boolean }
        token: { type: string, writeOnly: true, description: "A NetBird access token (service user, Network Admin). Absent keeps the saved one; empty removes it" }
    PublishConfig:
      type: object
      required: [mode, auth, groups, hardyosSignIn, hasSecret, default]
      properties:
        mode: { type: string, enum: ["off", netbird, public] }
        auth: { type: string, enum: [sso, password, pin, none] }
        groups: { type: array, items: { type: string }, description: "NetBird group IDs: who may reach it (NetBird-only) or sign in (SSO); empty: everyone (All)" }
        hardyosSignIn: { type: boolean, description: "Apps: the gateway asks for a HardyOS sign-in first" }
        hasSecret: { type: boolean, description: A password or PIN is saved }
        default: { type: boolean, description: The app follows the default mode }
    PublishItem:
      type: object
      required: [key, label, name, domain, url, config, published]
      properties:
        key: { type: string, description: "desktop (NetBird-only unless an admin confirms public), sso (HardyOS sign-in at sso.<base>, always public), files (share links at files.<base>) or app:<id>" }
        label: { type: string, description: Its name under the base domain }
        name: { type: string }
        domain: { type: string }
        url: { type: string }
        config: { $ref: "#/components/schemas/PublishConfig" }
        published: { type: boolean, description: NetBird has HardyOS's service for it }
        serviceId: { type: string }
        status: { type: string, description: "NetBird's status: pending, certificate_pending, active, tunnel_not_created, certificate_failed, error" }
        error: { type: string }
        syncedAt: { type: string }
    PublishRequest:
      type: object
      required: [mode]
      properties:
        mode: { $ref: "#/components/schemas/PublishMode" }
        auth: { $ref: "#/components/schemas/PublishAuth" }
        groups: { type: array, items: { type: string } }
        hardyosSignIn: { type: boolean }
        secret: { type: string, writeOnly: true, description: "Password (8+ characters) or PIN (4-12 digits). Absent keeps the saved one" }
        confirmPublic: { type: boolean, description: "Desktop only: must be true to publish it publicly (it includes administration)" }
        confirmOpen: { type: boolean, description: "Apps only: must be true to publish an app publicly with no sign-in in front (auth none) and HardyOS sign-in off; else 400 confirm_required" }
    AppPublish:
      allOf:
        - $ref: "#/components/schemas/PublishItem"
        - type: object
          required: [enabled, baseDomain, defaultMode]
          properties:
            enabled: { type: boolean, description: Publishing is set up }
            baseDomain: { type: string }
            defaultMode: { type: string }
    RemoteSyncInfo:
      type: object
      required: [at, created, updated, deleted]
      properties:
        at: { type: string, format: date-time }
        problem: { type: string }
        created: { type: integer }
        updated: { type: integer }
        deleted: { type: integer }
    RemoteGatewayInfo:
      type: object
      required: [listening]
      properties:
        listening: { type: boolean }
        address: { type: string }
        problem: { type: string }
    RemoteStatus:
      type: object
      required: [available, client, defaultManagementUrl, items, gateway]
      properties:
        available: { type: boolean, description: Publishing is available on this server }
        client: { $ref: "#/components/schemas/NetBirdClientStatus" }
        defaultManagementUrl: { type: string }
        settings: { $ref: "#/components/schemas/RemoteSettings" }
        items: { type: array, items: { $ref: "#/components/schemas/PublishItem" } }
        lastSync: { $ref: "#/components/schemas/RemoteSyncInfo" }
        gateway: { $ref: "#/components/schemas/RemoteGatewayInfo" }
    RemoteDomainRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [add, verify] }
        cluster: { type: string, description: "add: the proxy cluster (empty when NetBird has only one)" }
    NetBirdDomain:
      type: object
      required: [id, domain, validated, type]
      properties:
        id: { type: string }
        domain: { type: string }
        validated: { type: boolean }
        type: { type: string, description: free or custom }
        target_cluster: { type: string }
        require_subdomain: { type: boolean }
        supports_private: { type: boolean }
    NetBirdCluster:
      type: object
      required: [id, address, type, online, connected_proxies]
      properties:
        id: { type: string }
        address: { type: string }
        type: { type: string }
        online: { type: boolean }
        connected_proxies: { type: integer }
        private: { type: boolean }
    NetBirdGroup:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        peers_count: { type: integer }
    RemoteCheckStep:
      type: object
      required: [id, title, state]
      properties:
        id: { type: string, enum: [netbird, base, token, peer, domain, dns, private, sso] }
        title: { type: string }
        state: { type: string, enum: [ok, warn, bad, skipped] }
        detail: { type: string }
    DNSRecord:
      type: object
      required: [type, name, target, proxy, ttl]
      properties:
        type: { type: string, enum: [CNAME] }
        name: { type: string, description: "*.<base domain>" }
        target: { type: string, description: The proxy cluster's address }
        proxy: { type: string, description: "Cloudflare proxy status: DNS only (grey cloud)" }
        ttl: { type: string }
    RemoteCheck:
      type: object
      required: [steps, ready, supportsPrivate, domains, clusters, groups]
      properties:
        steps: { type: array, items: { $ref: "#/components/schemas/RemoteCheckStep" } }
        record: { $ref: "#/components/schemas/DNSRecord" }
        ready: { type: boolean }
        supportsPrivate: { type: boolean, description: The proxy cluster can serve NetBird-only services }
        domain: { $ref: "#/components/schemas/NetBirdDomain" }
        domains: { type: array, items: { $ref: "#/components/schemas/NetBirdDomain" } }
        clusters: { type: array, items: { $ref: "#/components/schemas/NetBirdCluster" } }
        groups: { type: array, items: { $ref: "#/components/schemas/NetBirdGroup" } }
        ssoIssuer: { type: string, description: "HardyOS's own sign-in provider's issuer, when set up" }
    # ---- end of remote access schemas ----
    # ---- sign-in provider (OIDC) schemas ----
    OidcStatus:
      type: object
      required: [issuer, issuerChosen, derivedIssuer, discovery, localAccounts, publicAdmins, keys]
      properties:
        issuer: { type: string, description: "The issuer apps are configured with" }
        issuerChosen: { type: boolean, description: An administrator chose it (else it follows Remote Access) }
        derivedIssuer: { type: string, description: "https://sso.<base>, or https://<desktop>/oidc without a base domain" }
        discovery: { type: string }
        localAccounts: { type: boolean }
        publicAdmins: { type: boolean, description: "Administrators may sign in through HardyOS sign-in from the internet (off by default)" }
        keys: { type: array, items: { $ref: "#/components/schemas/OidcKey" } }
    OidcKey:
      type: object
      required: [id, algorithm, state, createdAt]
      properties:
        id: { type: string }
        algorithm: { type: string }
        state: { type: string, enum: [next, active, retired] }
        createdAt: { type: string, format: date-time }
        activatedAt: { type: string, format: date-time }
        retiredAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    OidcClientSpec:
      type: object
      required: [name, kind, redirectUris]
      properties:
        name: { type: string, maxLength: 64 }
        kind: { type: string, enum: [confidential, public], description: "Public clients (browser apps, CLIs) have no secret and must use PKCE" }
        redirectUris: { type: array, items: { type: string }, maxItems: 20, description: "Matched exactly; https (http only to localhost, for public clients)" }
        postLogoutRedirectUris: { type: array, items: { type: string }, maxItems: 20 }
        allowedGroups: { type: array, items: { type: string }, description: "DOMAIN\\group; empty lets every account in" }
        firstParty: { type: boolean, description: No consent screen }
        preset: { type: string }
        disabled: { type: boolean }
    OidcClient:
      type: object
      required: [id, name, kind, redirectUris, postLogoutRedirectUris, allowedGroups, firstParty, preset, managedBy, disabled, hasSecret, createdAt, updatedAt]
      properties:
        id: { type: string, description: The client ID }
        name: { type: string }
        kind: { type: string, enum: [confidential, public] }
        redirectUris: { type: array, items: { type: string } }
        postLogoutRedirectUris: { type: array, items: { type: string } }
        allowedGroups: { type: array, items: { type: string } }
        firstParty: { type: boolean }
        preset: { type: string }
        managedBy: { type: string, description: "Set when Remote Access keeps this client (read-only here)" }
        disabled: { type: boolean }
        hasSecret: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }
    OidcClientResult:
      type: object
      required: [client]
      properties:
        client: { $ref: "#/components/schemas/OidcClient" }
        secret: { type: string, description: "Only when a secret was just made: shown once, only a hash is kept" }
    OidcPresetStep:
      type: object
      required: [where]
      properties:
        where: { type: string }
        field: { type: string }
        value: { type: string, description: "May hold {clientId}, {clientSecret} and {issuer}" }
    OidcPreset:
      type: object
      required: [id, name, description, client, steps, notes]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        client: { $ref: "#/components/schemas/OidcClientSpec" }
        redirectFromApp: { type: string, description: "The app shows the exact redirect URL (starting with this) once it has the client ID: paste it into the client" }
        steps: { type: array, items: { $ref: "#/components/schemas/OidcPresetStep" } }
        notes: { type: array, items: { type: string } }
    # ---- end of sign-in provider schemas ----
