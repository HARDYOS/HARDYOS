# Debian package for the HardyOS control plane and web desktop.
# Built by `make deb`; VERSION and ARCH come from the environment.
name: hardyos-core
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: HardyOS <noreply@hardyos.local>
description: |
  HardyOS control plane: hardyd (API and web desktop), hardyd-priv
  (privileged helper) and hardyctl (CLI).
license: Proprietary
depends:
  - adduser
  - systemd
recommends:
  - zfsutils-linux
  - smartmontools
contents:
  - src: ../dist/bin/hardyd
    dst: /usr/bin/hardyd
    file_info: { mode: 0755 }
  - src: ../dist/bin/hardyd-priv
    dst: /usr/bin/hardyd-priv
    file_info: { mode: 0755 }
  - src: ../dist/bin/hardyctl
    dst: /usr/bin/hardyctl
    file_info: { mode: 0755 }
  - src: ../web/apps/shell/dist/
    dst: /usr/share/hardyos/web/
    type: tree
  - src: ./systemd/hardyd.service
    dst: /lib/systemd/system/hardyd.service
  - src: ./systemd/hardyd-priv.service
    dst: /lib/systemd/system/hardyd-priv.service
  - src: ./systemd/hardyos-issue.service
    dst: /lib/systemd/system/hardyos-issue.service
  # Console login screen: the server's web address, kept current by hardyos-issue.service.
  - src: ./console/hardyos-issue
    dst: /usr/lib/hardyos/hardyos-issue
    file_info: { mode: 0755 }
  # Keep the boot disks in sync with kernel and initramfs updates.
  - src: ./boot/zz-hardyos-boot
    dst: /etc/kernel/postinst.d/zz-hardyos-boot
    type: config
    file_info: { mode: 0755 }
  - src: ./boot/zz-hardyos-boot
    dst: /etc/kernel/postrm.d/zz-hardyos-boot
    type: config
    file_info: { mode: 0755 }
  - src: ./boot/zz-hardyos-boot
    dst: /etc/initramfs/post-update.d/zz-hardyos-boot
    type: config
    file_info: { mode: 0755 }
scripts:
  postinstall: ./scripts/postinstall.sh
  preremove: ./scripts/preremove.sh
