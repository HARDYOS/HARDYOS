# Builds the ISO and test updates, then installs and runs HardyOS in a VM
# (os/smoke-test.sh): installer, first boot, sign-in, a storage pool, a
# settings backup and an update. Runs for pull requests and main; branches
# named test-build/... also keep the ISO and updates for testing elsewhere.
#
# Everything is signed with a key made for this run only: its public key is
# built into this ISO and nothing else, so these builds can never update a
# real HardyOS server.
name: Smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "test-build/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Install and run in a VM
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: version
        run: echo "VERSION=0.1.0~ci${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: test signing key (this run only)
        working-directory: daemon
        run: go run ./cmd/hardyrelease keygen -key "$RUNNER_TEMP/test.key" -pub internal/update/keys/zz-ci-test.pub -comment "ci-test-run-${GITHUB_RUN_ID}"
      - name: build .deb
        run: make deb VERSION="$VERSION"
      - name: build ISO
        run: os/build-iso.sh
      - name: test updates
        run: |
          sudo apt-get install -y -qq squashfs-tools >/dev/null
          sudo env "PATH=$PATH" HOME="$HOME" GOPATH="$(go env GOPATH)" GOCACHE="$(go env GOCACHE)" \
            os/test-updates.sh "dist/hardyos-$VERSION-amd64.squashfs" "$VERSION" "$RUNNER_TEMP/test.key" dist/updates
      - name: QEMU and KVM
        run: |
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf libarchive-tools jq >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: smoke test
        env:
          SMOKE_WORK: ${{ runner.temp }}/smoke
        run: |
          mkdir -p "$SMOKE_WORK"
          os/smoke-test.sh "dist/hardyos-$VERSION-amd64.iso" "dist/updates/hardyos-$VERSION.next-amd64.hupd"
      - name: VM logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: ${{ runner.temp }}/smoke/*.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/heads/test-build/')
        with:
          name: hardyos-test-iso
          path: dist/hardyos-*-amd64.iso
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/heads/test-build/')
        with:
          name: hardyos-test-updates
          path: dist/updates/*.hupd
          compression-level: 0
          retention-days: 7
