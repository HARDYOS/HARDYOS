name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: false
      - name: gofmt
        working-directory: daemon
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: vet
        working-directory: daemon
        run: go vet ./...
      - name: restic (the version HardyOS ships, for the cloud backup tests)
        run: sudo scripts/install-restic.sh /usr/local/bin/restic
      - name: test
        working-directory: daemon
        run: go test -race ./...
      - name: build
        run: make build-daemon

  zfs:
    name: ZFS integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: false
      - name: install ZFS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zfsutils-linux acl gdisk dosfstools squashfs-tools grub-efi-amd64-bin grub-pc-bin grub2-common
          sudo modprobe zfs
          zfs version
      - name: build test binaries
        working-directory: daemon
        run: |
          go test -c -o "$RUNNER_TEMP/priv.test" ./internal/priv
          go test -c -o "$RUNNER_TEMP/install.test" ./internal/install
          go test -c -o "$RUNNER_TEMP/backup.test" ./internal/backup
          go test -c -o "$RUNNER_TEMP/cloudbackup.test" ./internal/cloudbackup
          go test -c -o "$RUNNER_TEMP/replication.test" ./internal/replication
      - name: storage operations against real ZFS
        run: sudo HARDYOS_ZFS_INTEGRATION=1 "$RUNNER_TEMP/priv.test" -test.run TestZFSIntegration -test.v
      - name: installer on loop devices
        run: sudo HARDYOS_ZFS_INTEGRATION=1 "$RUNNER_TEMP/install.test" -test.run TestInstallIntegration -test.v
      - name: chroot mounts in a private mount namespace (host /dev kept, busy teardown, pool export)
        run: sudo HARDYOS_MOUNTNS_TEST=1 HARDYOS_ZFS_INTEGRATION=1 "$RUNNER_TEMP/install.test" -test.run 'SystemDirs' -test.v
      - name: settings backups on a pool
        run: sudo HARDYOS_ZFS_INTEGRATION=1 "$RUNNER_TEMP/backup.test" -test.run TestZFSBackupIntegration -test.v
      - name: restic for cloud backups
        run: sudo scripts/install-restic.sh /usr/local/bin/restic
      - name: cloud backups from snapshots, restores through a staging dataset
        run: sudo HARDYOS_ZFS_INTEGRATION=1 "$RUNNER_TEMP/cloudbackup.test" -test.run 'TestZFSIntegrationCloudBackup|TestSandbox' -test.v -test.timeout 10m
      - name: replication between two pools over mutual TLS (full, incremental, resume, refusals, restore)
        run: sudo HARDYOS_ZFS_INTEGRATION=1 "$RUNNER_TEMP/replication.test" -test.run TestZFSReplicationIntegration -test.v -test.timeout 15m

  nfs:
    name: NFS (loopback)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: false
      - name: install ZFS and the NFS server
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq zfsutils-linux acl nfs-kernel-server
          sudo modprobe zfs
          sudo systemctl disable --now nfs-server.service || true
          # As in the HardyOS image (os/live/config/hooks): no generated
          # mount requirements for exported paths.
          sudo mkdir -p /etc/systemd/system-generators
          sudo ln -sf /dev/null /etc/systemd/system-generators/nfs-server-generator
          sudo systemctl daemon-reload
      - name: build test binary
        working-directory: daemon
        run: go test -c -o "$RUNNER_TEMP/priv.test" ./internal/priv
      - name: shared folders over NFS, mounted over loopback
        run: sudo HARDYOS_ZFS_INTEGRATION=1 HARDYOS_NFS_INTEGRATION=1 "$RUNNER_TEMP/priv.test" -test.run TestNFSIntegration -test.v
      - name: NFS server logs
        if: failure()
        run: |
          sudo journalctl -u nfs-server -u nfs-mountd -u rpcbind --no-pager -n 80 || true
          systemctl --failed --no-pager || true
          sudo journalctl --no-pager -n 200 | grep -iE "nfs|mount|depend" || true
          sudo cat /etc/exports.d/hardyos.exports || true

  domain:
    name: Domain controller (Samba)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: false
      - name: install Samba
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq samba samba-ad-dc samba-ad-provision samba-dsdb-modules samba-vfs-modules winbind libnss-winbind smbclient iputils-arping bind9-dnsutils
          sudo systemctl stop smbd nmbd winbind samba-ad-dc 2>/dev/null || true
          # The file server test looks domain accounts up through winbind.
          sudo sed -i -E '/^(passwd|group):/{/winbind/!s/$/ winbind/}' /etc/nsswitch.conf
          sudo install -D -m 0755 packaging/domain/hardyos-dc-admin /usr/lib/hardyos/hardyos-dc-admin
          # A private LAN for the DC: cloud networks answer ARP for every address.
          sudo ip link add lan0 type dummy
          sudo ip addr add 10.123.0.1/24 dev lan0
          sudo ip link set lan0 up
      - name: build test binary
        working-directory: daemon
        run: go test -c -o "$RUNNER_TEMP/domain.test" ./internal/domain
      - name: two domain controllers - create, join, replicate, leave, back up, restore, take over
        run: |
          sudo HARDYOS_DC_INTEGRATION=1 HARDYOS_DC_TEST_ADDRESS=10.123.0.20/24 HARDYOS_DC_TEST_ADDRESS2=10.123.0.21/24 \
            HARDYOS_DC_TEST_GATEWAY=10.123.0.1 "$RUNNER_TEMP/domain.test" -test.run TestDCIntegration -test.v -test.timeout 30m
      - name: file server - join as a member, SMB access by rule, guest, recycle bin, Previous Versions
        run: |
          sudo HARDYOS_DC_INTEGRATION=1 HARDYOS_DC_TEST_ADDRESS=10.123.0.20/24 HARDYOS_DC_TEST_GATEWAY=10.123.0.1 \
            "$RUNNER_TEMP/domain.test" -test.run TestSMBMemberIntegration -test.v -test.timeout 20m
      - name: SFTP - domain accounts in their own views, by rule, no shell or tunnels
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server
          sudo mkdir -p /run/sshd
          sudo HARDYOS_DC_INTEGRATION=1 HARDYOS_DC_TEST_ADDRESS=10.123.0.20/24 HARDYOS_DC_TEST_GATEWAY=10.123.0.1 \
            "$RUNNER_TEMP/domain.test" -test.run TestSFTPMemberIntegration -test.v -test.timeout 20m
      - name: domain controller logs
        if: failure()
        run: |
          sudo sh -c 'tail -60 /var/lib/hardyos-dc/log/log.* /var/lib/hardyos-dc2/log/log.* 2>/dev/null' || true

  apps:
    name: Docker apps (KinCast)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: false
      - name: Docker and Compose
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
      - name: build test binary
        working-directory: daemon
        run: go test -c -o "$RUNNER_TEMP/apps.test" ./internal/apps
      - name: install, run, update and remove KinCast with real Docker
        working-directory: daemon/internal/apps
        run: sudo HARDYOS_DOCKER_INTEGRATION=1 "$RUNNER_TEMP/apps.test" -test.run TestDockerIntegration -test.v -test.timeout 25m
      - name: container logs
        if: failure()
        run: |
          sudo docker ps -a --filter label=org.hardyos.app
          for c in $(sudo docker ps -aq --filter label=org.hardyos.app); do sudo docker logs --tail 80 "$c" 2>&1; done

  photos:
    name: Photos (Immich)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: false
      - name: Docker and Compose
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
      - name: build test binary
        working-directory: daemon
        run: go test -c -o "$RUNNER_TEMP/photos.test" ./internal/photos
      - name: the catalog's Immich set up by Photos, signing in with HardyOS's provider
        working-directory: daemon/internal/photos
        run: sudo HARDYOS_IMMICH_INTEGRATION=1 "$RUNNER_TEMP/photos.test" -test.run TestImmichIntegration -test.v -test.timeout 20m
      - name: container logs
        if: failure()
        run: |
          sudo docker ps -a --filter label=com.docker.compose.project=hardyos-immich-it
          for c in $(sudo docker ps -aq --filter label=com.docker.compose.project=hardyos-immich-it); do sudo docker logs --tail 80 "$c" 2>&1; done

  vms:
    name: Virtual machines (KVM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: false
      - name: ZFS, libvirt and QEMU
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq zfsutils-linux libvirt-daemon-system libvirt-clients qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools xorriso dnsmasq-base
          sudo modprobe zfs
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          sudo systemctl start libvirtd
          sudo virsh -c qemu:///system net-start default || true
          sudo virsh -c qemu:///system version --daemon
      - name: build test binary
        working-directory: daemon
        run: go test -c -o "$RUNNER_TEMP/vms.test" ./internal/vms
      - name: download, import, boot, console, snapshot, roll back and delete a VM
        run: sudo HARDYOS_VM_INTEGRATION=1 "$RUNNER_TEMP/vms.test" -test.run TestLibvirtIntegration -test.v -test.timeout 20m
      - name: libvirt logs
        if: failure()
        run: |
          sudo tail -80 /var/log/libvirt/qemu/cirros.log || true
          sudo journalctl -u libvirtd --no-pager -n 80 || true
          sudo dmesg | grep -iE "apparmor|kvm" | tail -30 || true

  web:
    name: Web (desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: API client is up to date
        working-directory: web
        run: |
          pnpm gen:api
          git diff --exit-code -- packages/api-client/src/schema.gen.ts
      - name: typecheck
        working-directory: web
        run: pnpm typecheck
      - name: test
        working-directory: web
        run: pnpm test
      - name: build
        working-directory: web
        run: pnpm build

  package:
    name: Debian package
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: build .deb
        run: make deb
      - uses: actions/upload-artifact@v4
        with:
          name: hardyos-core-deb
          path: dist/*.deb
          retention-days: 14

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck os/*.sh scripts/*.sh packaging/scripts/*.sh \
            os/live/auto/* os/live/config/hooks/normal/*
