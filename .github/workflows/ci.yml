name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: false
      - name: gofmt
        working-directory: daemon
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: vet
        working-directory: daemon
        run: go vet ./...
      - name: test
        working-directory: daemon
        run: go test -race ./...
      - name: build
        run: make build-daemon

  zfs:
    name: ZFS integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: false
      - name: install ZFS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zfsutils-linux gdisk dosfstools squashfs-tools grub-efi-amd64-bin grub-pc-bin grub2-common
          sudo modprobe zfs
          zfs version
      - name: build test binaries
        working-directory: daemon
        run: |
          go test -c -o "$RUNNER_TEMP/priv.test" ./internal/priv
          go test -c -o "$RUNNER_TEMP/install.test" ./internal/install
          go test -c -o "$RUNNER_TEMP/backup.test" ./internal/backup
      - name: storage operations against real ZFS
        run: sudo HARDYOS_ZFS_INTEGRATION=1 "$RUNNER_TEMP/priv.test" -test.run TestZFSIntegration -test.v
      - name: installer on loop devices
        run: sudo HARDYOS_ZFS_INTEGRATION=1 "$RUNNER_TEMP/install.test" -test.run TestInstallIntegration -test.v
      - name: settings backups on a pool
        run: sudo HARDYOS_ZFS_INTEGRATION=1 "$RUNNER_TEMP/backup.test" -test.run TestZFSBackupIntegration -test.v

  domain:
    name: Domain controller (Samba)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: false
      - name: install Samba
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq samba samba-ad-dc samba-ad-provision samba-dsdb-modules winbind smbclient iputils-arping bind9-dnsutils
          sudo systemctl stop smbd nmbd winbind samba-ad-dc 2>/dev/null || true
          sudo install -D -m 0755 packaging/domain/hardyos-dc-admin /usr/lib/hardyos/hardyos-dc-admin
          sudo install -m 0644 packaging/systemd/hardyos-dc.service /etc/systemd/system/hardyos-dc.service
          sudo systemctl daemon-reload
          # A private LAN for the DC: cloud networks answer ARP for every address.
          sudo ip link add lan0 type dummy
          sudo ip addr add 10.123.0.1/24 dev lan0
          sudo ip link set lan0 up
      - name: build test binary
        working-directory: daemon
        run: go test -c -o "$RUNNER_TEMP/domain.test" ./internal/domain
      - name: provision, manage and delete a real domain
        run: |
          sudo HARDYOS_DC_INTEGRATION=1 HARDYOS_DC_TEST_ADDRESS=10.123.0.20/24 HARDYOS_DC_TEST_GATEWAY=10.123.0.1 \
            "$RUNNER_TEMP/domain.test" -test.run TestDCIntegration -test.v
      - name: domain controller logs
        if: failure()
        run: |
          sudo journalctl -u hardyos-dc --no-pager | tail -100 || true
          sudo sh -c 'tail -50 /var/lib/hardyos-dc/log/log.* 2>/dev/null' || true

  web:
    name: Web (desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: API client is up to date
        working-directory: web
        run: |
          pnpm gen:api
          git diff --exit-code -- packages/api-client/src/schema.gen.ts
      - name: typecheck
        working-directory: web
        run: pnpm typecheck
      - name: test
        working-directory: web
        run: pnpm test
      - name: build
        working-directory: web
        run: pnpm build

  package:
    name: Debian package
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: build .deb
        run: make deb
      - uses: actions/upload-artifact@v4
        with:
          name: hardyos-core-deb
          path: dist/*.deb
          retention-days: 14

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck os/*.sh scripts/*.sh packaging/scripts/*.sh \
            os/live/auto/* os/live/config/hooks/normal/*
