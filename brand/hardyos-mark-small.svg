<svg xmlns="http://www.w3.org/2000/svg" viewBox="66 40 380 432" width="380" height="432">
  <!-- HardyOS mark for small sizes (under ~28 px): the hexagon and H without
       the thin crossbars and circuit traces, which blur when scaled down. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#8B5CFF"/>
    </linearGradient>
  </defs>
  <polygon points="256,62 424,159 424,353 256,450 88,353 88,159"
           fill="#080C1A" stroke="url(#g)" stroke-width="30" stroke-linejoin="round"/>
  <rect x="162" y="160" width="56" height="192" rx="12" fill="url(#g)"/>
  <rect x="294" y="160" width="56" height="192" rx="12" fill="url(#g)"/>
  <rect x="210" y="236" width="92" height="40" rx="10" fill="#FFFFFF"/>
</svg>
